ing 專區 Passage 2（音樂廳聲學）高度相關！", "ex": "A concert hall's materials directly shape the warmth and timbre of orchestral music."}, {"id": "v8", "page": 1, "word": "suppress", "pos": "v.", "zh": "壓制；抑制、鎮壓", "def": "to end sth. by force (also: to prevent sth. from being expressed)", "note": "議論文常用：suppress creativity / suppress critical thinking。", "ex": "Overly rigid instruction can suppress students' willingness to communicate."}, {"id": "v9", "page": 1, "word": "apertures", "pos": "n.", "zh": "孔徑；縫隙、光圈", "def": "a small and often narrow opening, especially one that allows light into a camera", "note": "單數為 aperture；科學與光學閱讀常見詞。", "ex": "Adjusting the camera's aperture controls how much light reaches the sensor."}, {"id": "v10", "page": 2, "word": "acquire", "pos": "v.", "zh": "獲得；習得（技能/語言）", "def": "to get or obtain sth.", "note": "EAP 寫作必備！比 get 正式得多：acquire a second language / acquire practical skills。", "ex": "LBU allows students to acquire a language through a more effective, personalized pathway."}, {"id": "v11", "page": 2, "word": "rigid", "pos": "adj.", "zh": "僵化的；死板的、嚴格的", "def": "stiff or fixed; not able to be bent or moved", "note": "替換你在 Essay 1 誤用的 solid！rigid rules / rigid instruction。", "ex": "Traditional methods often produce rigid, textbook-bound English."}, {"id": "v12", "page": 2, "word": "self-assurance", "pos": "n.", "zh": "自信心", "def": "confidence that you have in your own abilities", "note": "confidence 的高分同義替換詞，避免全篇重複 confidence。", "ex": "Interactive role-plays boost learners' self-assurance in real-life conversations."}, {"id": "v13", "page": 2, "word": "authentic", "pos": "adj.", "zh": "真實的；道地的", "def": "real, true", "note": "高頻搭配：authentic scenarios / authentic communicative practice。", "ex": "LBU incorporates authentic scenarios where students practice conversing with strangers."}, {"id": "v14", "page": 2, "word": "tailored", "pos": "adj.", "zh": "量身打造的；因材施教的", "def": "used to describe clothing shaped to fit closely; (in writing) adapted to specific needs", "note": "學術延伸用法超好用：tailored to learners' individual needs（針對學習者需求量身定制）。", "ex": "Effective educators create a stimulating environment tailored to learners' individual talents."}, {"id": "v15", "page": 2, "word": "grasp", "pos": "v.", "zh": "抓緊；徹底理解、掌握", "def": "to quickly take sth. in your hands and hold it firmly; (figurative) to understand fully", "note": "學術延伸用法：grasp complex concepts / grasp the fundamentals（替換 understand）。", "ex": "Expert teachers simplify complex concepts so that students can grasp the fundamentals easily."}, {"id": "v16", "page": 2, "word": "pedagogical", "pos": "adj.", "zh": "教學法的；教育學的", "def": "relating to the method and theory of teaching", "note": "你手寫的例句非常棒！注意 pedagogy 指教學法，不可用來指代「中學教育（secondary education）」。", "ex": "Some educators question the pedagogical value of rote learning."}, {"id": "v17", "page": 2, "word": "inadequate", "pos": "adj.", "zh": "不足的；不夠格的", "def": "not good enough or too low in quality", "note": "反駁段收尾高分詞：inadequate for achieving...（不足以達成……）。", "ex": "An overly traditional approach is inadequate for achieving true language proficiency."}, {"id": "v18", "page": 2, "word": "imperative", "pos": "adj.", "zh": "極其重要／迫切的", "def": "extremely important or urgent", "note": "比 very important 高級得多：making ... all the more imperative。", "ex": "Clear ethical guidelines make AI literacy education all the more imperative."}, {"id": "v19", "page": 3, "word": "ordinary", "pos": "adj.", "zh": "普通的；平常的", "def": "not different or special or unexpected in any way; usual", "note": "常用對比：ordinary citizens / out of the ordinary。", "ex": "Ordinary daily tasks can be streamlined through thoughtful workflow design."}, {"id": "v20", "page": 3, "word": "Pyrex glass", "pos": "n.", "zh": "耐熱玻璃（派熱克斯玻璃）", "def": "type of glass that doesn't break when it is heated, used for making containers for cooking", "note": "科學/化學與生活閱讀常見專有名詞。", "ex": "Laboratory beakers are typically crafted from Pyrex glass to withstand sudden temperature changes."}, {"id": "v21", "page": 3, "word": "strip", "pos": "v.", "zh": "剝除；剝奪", "def": "to remove, pull, or tear the covering or outer layer from sth.", "note": "學術延伸：strip sb. of sth.（剝奪某人的……），如 strip students of autonomy。", "ex": "Excessive automation risks stripping assignments of genuine intellectual challenge."}, {"id": "v22", "page": 3, "word": "evolving", "pos": "adj.", "zh": "不斷演變的；逐步發展的", "def": "developing gradually", "note": "Essay 2 開頭/主體段高分搭配：an evolving workplace / rapidly evolving technologies。", "ex": "Modern higher education equips graduates for an evolving workplace."}, {"id": "v23", "page": 3, "word": "evaluate", "pos": "v.", "zh": "評估；評價", "def": "to judge or calculate the quality, importance, amount, or value of sth.", "note": "EAP 核心學術動詞：critically evaluate digital outputs / evaluate performance。", "ex": "Educators must teach students how to critically evaluate AI-generated outputs."}, {"id": "v24", "page": 3, "word": "cognitive", "pos": "adj.", "zh": "認知的；思維過程的", "def": "connected with thinking or conscious mental processes", "note": "高頻學術搭配：cognitive development / cognitive offloading / cognitive focus。", "ex": "Over-reliance on algorithms may threaten students' cognitive development."}, {"id": "v25", "page": 3, "word": "offload", "pos": "v.", "zh": "卸下；轉嫁（工作/思考負擔）", "def": "to get rid of sth. that you do not want by giving it to someone else", "note": "Practice Paper 1 核心術語：cognitive offloading（認知卸載）。", "ex": "Students should avoid offloading complex analytical tasks entirely to AI."}, {"id": "v26", "page": 3, "word": "delegate", "pos": "v. / n.", "zh": "委派、授權 (v.)；代表 (n.)", "def": "(v.) to give a particular job, duty, or right to someone else; (n.) a person chosen by a group to speak/vote at a meeting", "note": "動詞搭配：delegate tasks to algorithms / delegate responsibility。", "ex": "Learners who delegate critical reasoning to software struggle with unfamiliar problems."}, {"id": "v27", "page": 4, "word": "superficial", "pos": "adj.", "zh": "膚淺的；表面的", "def": "never thinking about things that are serious or important; only on the surface", "note": "超好用負面形容詞：superficial credentials / a superficial chore（改寫 box-ticking exercise 的神詞！）。", "ex": "Under immense pressure, learners may treat volunteering as a superficial chore."}, {"id": "v28", "page": 4, "word": "credentials", "pos": "n.", "zh": "資歷；資格證書、學歷證明", "def": "the abilities and experience that make someone suitable for a particular job or activity, or proof of them", "note": "回應你筆記上的「資歷??」：沒錯！就是指「資歷、學歷證明、專業資格」，常用複數 credentials。", "ex": "Over-reliance on AI may produce graduates with superficial credentials."}, {"id": "v29", "page": 4, "word": "institutions", "pos": "n.", "zh": "機構；院校（如大學、銀行）", "def": "a large and important organization, such as a university or bank", "note": "拼寫注意：in-sti-tu-tions（不要多寫 a 變成 instituations！），可用來替換 universities 避免重複。", "ex": "Educational institutions must establish clear guidelines for academic integrity."}, {"id": "v30", "page": 4, "word": "impair", "pos": "v.", "zh": "損害；削弱", "def": "to spoil sth. or make it weaker so that it is less effective", "note": "替換 harm / damage 的高分詞：impair analytical development / impair judgment。", "ex": "Unrestricted reliance on automation can impair students' independent analytical development."}, {"id": "v31", "page": 4, "word": "mandatory", "pos": "adj.", "zh": "強制的；法定的", "def": "sth. that is mandatory must be done, or is demanded by law", "note": "同義替換：compulsory（注意拼寫是 compulsory 非 complusory）。", "ex": "Schools should consider whether community service should be a mandatory requirement."}, {"id": "v32", "page": 4, "word": "literacy", "pos": "n.", "zh": "素養；讀寫能力、某領域知識", "def": "knowledge of a particular subject, or a particular type of knowledge", "note": "Essay 2 結論升級詞：AI literacy courses / digital literacy。", "ex": "Universities should implement mandatory AI literacy courses alongside ethical guidelines."}, {"id": "v33", "page": 4, "word": "integrity", "pos": "n.", "zh": "誠信；正直", "def": "the quality of being honest and having strong moral principles that you refuse to change", "note": "你手寫的例句：a person of integrity（正直的人）；學術必考搭配：academic integrity（學術誠信）。", "ex": "Clear boundaries help institutions safeguard academic integrity."}, {"id": "v34", "page": 5, "word": "cultivate", "pos": "v.", "zh": "培養、陶冶；耕作", "def": "to prepare land and grow crops; (academic) to nurture or develop a skill, attitude, or quality", "note": "你標記了同義詞 nurture！寫作高頻搭配：cultivate empathy / cultivate active citizenship。", "ex": "Classroom instruction alone cannot adequately cultivate active citizenship."}, {"id": "v35", "page": 5, "word": "framework", "pos": "n.", "zh": "框架；體系結構", "def": "a supportive structure around which sth. can be built", "note": "常用搭配：experiential learning framework / regulatory framework。", "ex": "A clear policy framework helps balance innovation with academic fairness."}, {"id": "v36", "page": 5, "word": "inherently", "pos": "adv.", "zh": "本質上；固有的、天生地", "def": "in a way that exists as a natural or basic part of sth.", "note": "對應你畫的雙向箭頭：inherently (adv.) ↔ intrinsic (adj.)！", "ex": "True volunteering is inherently defined by free choice and intrinsic motivation."}, {"id": "v37", "page": 5, "word": "intrinsic", "pos": "adj.", "zh": "內在的；固有的、本質的", "def": "being an extremely important and basic characteristic of a person or thing", "note": "高頻搭配：intrinsic motivation（內在動機）↔ extrinsic motivation（外在動機）。", "ex": "Critics warn that external mandates may undermine students' intrinsic motivation."}, {"id": "v38", "page": 5, "word": "goodwill", "pos": "n.", "zh": "善意；友善與樂於助人之心", "def": "friendly and helpful feelings", "note": "不可數名詞！常用搭配：an act of goodwill（善舉）。", "ex": "Mandating hours may transform an act of goodwill into an institutional obligation."}, {"id": "v39", "page": 5, "word": "disproportionate", "pos": "adj.", "zh": "不成比例的；過度的", "def": "too large or too small in comparison to sth. else, or not deserving its importance", "note": "反駁段高分詞：place disproportionate pressure on...（施加不成比例的壓力）。", "ex": "Mandatory policies can place disproportionate pressure on students facing public exams."}, {"id": "v40", "page": 5, "word": "introduce", "pos": "v.", "zh": "引入；推行、初次介紹", "def": "to put sth. into use, operation, or a place for the first time", "note": "在政策類文章中表示「推行／引入措施」：introduce compulsory modules / introduce a policy。", "ex": "Educators should introduce compulsory modules focusing on ethical judgment."}, {"id": "v41", "page": 5, "word": "longitudinal research", "pos": "n. phr.", "zh": "縱向研究（長期追蹤研究）", "def": "research done on people or groups over a long period of time", "note": "引用實證研究時超有說服力：Longitudinal surveys reveal that...。", "ex": "Longitudinal research reveals higher civic participation among former student volunteers."}, {"id": "v42", "page": 5, "word": "readiness", "pos": "n.", "zh": "準備就緒；意願", "def": "willingness or a state of being prepared for sth.", "note": "職場/教育主題必備：workplace readiness / career readiness。", "ex": "Hands-on mentoring builds workplace readiness long before graduation."}, {"id": "v43", "page": 6, "word": "chore", "pos": "n.", "zh": "瑣事；乏味的例行苦差事", "def": "a job or piece of work that is often boring or unpleasant but needs to be done regularly", "note": "改寫 box-ticking exercise 的絕佳用詞：a superficial chore！", "ex": "Without reflection, students may treat service hours as a meaningless chore."}, {"id": "v44", "page": 6, "word": "underprivileged", "pos": "adj.", "zh": "弱勢的；貧困缺乏機會的", "def": "without money, possessions, education, opportunities, etc. that the average person has", "note": "替換你在 Essay 3 誤用的 minorities！underprivileged groups / disadvantaged backgrounds。", "ex": "Direct community contact builds empathy for underprivileged groups."}, {"id": "v45", "page": 6, "word": "immense", "pos": "adj.", "zh": "巨大的；極大的", "def": "extremely large in size or degree", "note": "替換錯誤搭配 many stress！stress 不可數，請用 immense stress / immense pressure。", "ex": "Under such immense pressure, students often opt for the least demanding tasks."}, {"id": "v46", "page": 6, "word": "mature", "pos": "adj.", "zh": "成熟的", "def": "behaving like adults in a way that shows being well developed emotionally", "note": "Essay 3 B+ 範文句：develop mature social values。", "ex": "Structured community service enables adolescents to develop mature social values."}, {"id": "v47", "page": 6, "word": "exacerbate", "pos": "v.", "zh": "加劇；使惡化", "def": "to make sth. that is already bad even worse", "note": "反駁段必背高級動詞！替換 make worse：exacerbate the heavy workload / exacerbate inequality。", "ex": "Opponents argue that additional mandates exacerbate students' heavy academic workload."}, {"id": "v48", "page": 6, "word": "align", "pos": "v.", "zh": "對準；使一致、契合", "def": "to put 2 or more things into a straight line; (academic) to match or bring into agreement", "note": "Essay 3 結論升級神詞：align A with B（使 A 與 B 一致）／ causes aligned with their interests。", "ex": "Schools should thoughtfully align service hours with broader educational objectives."}];
const TOOLKIT = {"intros": [{"name": "1. 目標切入法（最適合教育、政策類）", "formula": "A fundamental goal of [領域] is not merely to [基本目標], but also to [更高層目標]. Yet, whether [核心政策] is the most effective way to achieve this remains a subject of intense debate.", "example": "A fundamental goal of secondary education is not merely to cultivate academic competence, but also to foster a strong sense of civic responsibility. Yet, whether schools should mandate community service as a graduation requirement remains a subject of intense debate."}, {"name": "2. 傳統與現代對比法（升級版趨勢開頭）", "formula": "For decades, traditional [領域/模式] has equated [舊標準] with [成功/效率]. In recent years, however, [新現象/挑戰] has prompted [機構/社會] to reconsider [核心問題].", "example": "For decades, traditional management models have equated long working hours with high productivity. In recent years, however, rising rates of employee burnout have prompted organizations worldwide to reconsider the standard five-day schedule."}, {"name": "3. 直接拋出爭議法（最幹練、考官青睞）", "formula": "The question of whether [核心爭議點] has sparked widespread debate among [相關群體, 如 educators / policymakers]. While some contend that [反方觀點], others emphasize that [正方觀點].", "example": "The question of whether universities should integrate generative artificial intelligence (AI) into undergraduate coursework has sparked widespread debate among educators."}, {"name": "4. 兩難困境切入法（最展現批判思維）", "formula": "As [核心事物] becomes increasingly prevalent, [決策主體] face a growing dilemma: how to [追求的好處 A] without [引發的風險 B].", "example": "As generative AI becomes increasingly embedded in daily life, universities face a growing dilemma: how to prepare students for a technology-driven workforce without undermining independent thinking."}], "theses": [{"type": "讓步轉折型（最推薦，自帶思辨感）", "pattern": "Although [簡述反方擔憂], [你的核心主張] is essential because it [理由 1] and [理由 2]."}, {"type": "對比取捨型（適合二選一題目）", "pattern": "Rather than [反方做法], [主體] should [你的主張], as this approach both [理由 1] and [理由 2]."}, {"type": "學術動詞替換型（戒掉 This essay argues）", "pattern": "This paper contends / maintains that [主張], as it [理由 1] while [理由 2]."}], "transitions": [{"pos": "分論點 1 → 分論點 2（遞進）", "formulas": ["Beyond [概括上一段核心詞], [本段核心主題] also plays a vital role in...", "However, [上一段好處] is only the first step; [下一段核心] is equally critical."]}, {"pos": "正方觀點 → 反駁段（轉折）", "formulas": ["Despite these compelling advantages, the implementation of [主題] is not without criticism.", "Nevertheless, [主題] is not without drawbacks. While [主題] offers clear benefits, critics raise concerns regarding [反方擔憂]."]}, {"pos": "反駁段 → 結論段（收束）", "formulas": ["Therefore, [反方做法] is inadequate for achieving [目標], making a balanced adoption of [正方主張] all the more imperative.", "In conclusion, weighing both [維度 1] and [維度 2] demonstrates that..."]}], "dimensions": [{"topic": "強制社區服務 (Paper 2)", "b1": "品格與心理層面（內在）：同理心、社會責任感、跳出舒適圈", "b2": "實務與職場層面（外在）：組織溝通軟實力、結識導師、職場準備"}, {"topic": "四天工作制 (Paper 3)", "b1": "員工個人層面（內在）：緩解職業倦怠、改善身心健康與家庭關係", "b2": "企業營運層面（外在）：精簡無效會議、提高單位產出、降低離職與招聘成本"}, {"topic": "通用萬能切割公式", "b1": "「改變心態／健康／體驗」（偏內在感受、短期）", "b2": "「提升能力／效率／長遠出路」（偏客觀成果、長期）"}], "peelc": [{"step": "P — Point（主題句，約 20 詞）", "desc": "一句話點明本段唯一維度，與引言 Thesis 100% 對應。"}, {"step": "E — Evidence（文獻改寫，約 30–35 詞）", "desc": "移開視線 3 秒用自己的話轉述 Source 核心依據 + 規範 APA 引用。"}, {"step": "E — Explain Mechanism（因果推演，約 40 詞）", "desc": "最容易拉字數與拿高分！問兩次 How / Why，寫出 A→B→C 因果鏈或與傳統做法對比。"}, {"step": "Example — Concrete Scenario（具體場景，約 35–40 詞）", "desc": "把抽象詞變成畫面（例如安老院帶長者伸展遊戲、課堂點餐角色扮演）。"}, {"step": "L — Link（收束回扣，約 20 詞）", "desc": "一句話點出此好處對學生／企業／社會的長遠意義。"}], "paper3": {"title": "Practice Paper 3: The Four-Day Workweek（考前衝刺模擬題）", "prompt": "In recent years, organizations worldwide have experimented with alternative working schedules to improve workplace efficiency and employee well-being. Read the three source texts and argue for your opinion about whether companies should adopt a four-day workweek without reducing employee pay.", "sources": [{"label": "Source text A", "apa": "Lindqvist, E. (2022). Organizational productivity and human capital management. Nordic Journal of Business Studies, 14(1), 22–37.", "text": "Traditional industrial management models measure employee output primarily by the number of hours spent at the workplace. However, contemporary organizational research demonstrates that in knowledge-based economies, cognitive focus and energy are finite resources. Extending working hours beyond an optimal threshold yields diminishing returns, as fatigue leads to higher error rates and reduced creative problem-solving. Consequently, progressive management theories advocate evaluating performance based on measurable outcomes rather than physical presence. When organizations streamline inefficient workflows—such as unnecessary meetings and redundant administrative procedures—employees can often accomplish the same volume of high-quality work within a shorter timeframe."}, {"label": "Source text B", "apa": "Vance, G. P. (2023). Operational constraints of compressed work schedules. Management & Economics Quarterly, 29(3), 175–190.", "text": "Despite appealing theoretical benefits, implementing a four-day workweek presents substantial operational risks for many businesses. In client-facing sectors such as healthcare, retail, logistics, and financial services, maintaining five- or seven-day coverage is essential. Reducing individual schedules without cutting pay forces companies either to hire additional staff—significantly inflating labor costs—or to risk delayed customer responses and lost competitiveness. Furthermore, compressing a five-day workload into four days can inadvertently intensify daily workplace stress. When expectations remain unchanged while available hours shrink, employees often experience heightened time pressure, fewer social breaks, and increased burnout by the end of each workday, undermining the very well-being the policy aims to protect."}, {"label": "Source text C", "apa": "Gomez, R., & Lee, J. (2023). Work-life balance and employee retention in modern enterprises. Journal of Occupational Psychology, 41(2), 95–112.", "text": "Large-scale pilot trials across multiple countries indicate that a four-day workweek with full pay yields substantial benefits for both workers and employers. Having an extra day off allows employees to recover from work-related stress, attend to personal and family commitments, and pursue leisure activities, resulting in marked improvements in mental and physical health. From an organizational perspective, healthier and more rested employees exhibit higher morale, stronger loyalty, and greater focus during working hours. Participating firms consistently report dramatic reductions in absenteeism and staff turnover, saving considerable recruitment and training expenses while enhancing their attractiveness to top talent in competitive labor markets."}], "modelEssay": ["For decades, traditional management models have equated long working hours with high productivity. In recent years, however, rising rates of employee burnout and shifting workplace expectations have prompted organizations worldwide to reconsider the standard five-day schedule. While critics warn that shorter workweeks may create operational disruptions and inflate labor costs, this essay contends that companies should adopt a four-day workweek without reducing employee pay because it substantially improves employee well-being and strengthens long-term organizational efficiency.", "To understand why a shorter schedule outperforms conventional working arrangements, it is first necessary to examine its impact on employees' physical and psychological health. In modern knowledge-based economies, human cognitive focus and energy are finite resources rather than unlimited commodities; pushing staff beyond an optimal working threshold leads to exhaustion, frequent mistakes, and diminished creativity (Lindqvist, 2022). According to Gomez and Lee (2023), international pilot trials demonstrate that granting workers an extra paid day off enables them to recover from occupational stress, fulfill family responsibilities, and engage in restorative leisure activities. For instance, rather than spending every weekend catching up on domestic chores while remaining mentally fatigued, employees with a three-day weekend can genuinely recharge and return to the office with renewed energy. Consequently, prioritizing adequate rest directly protects mental health and cultivates a more sustainable work-life balance.", "Beyond enhancing individual well-being, transitioning to a four-day workweek also yields measurable operational and financial advantages for employers. As Lindqvist (2022) highlights, progressive management approaches evaluate staff by concrete outcomes rather than hours spent at a desk; when firms eliminate redundant meetings and inefficient administrative routines, teams frequently maintain the same high-quality output within a compressed schedule. In a practical corporate setting, replacing unfocused afternoon check-ins with concise digital updates allows staff to dedicate uninterrupted blocks of time to core tasks. Furthermore, Gomez and Lee (2023) report that well-rested employees display stronger workplace morale, deeper organizational loyalty, and markedly lower rates of absenteeism and turnover. By retaining experienced personnel, companies not only avoid immense recruitment and training expenses but also strengthen their competitiveness when attracting top talent.", "Nevertheless, implementing a four-day workweek with full pay is not without operational drawbacks. Opponents argue that client-facing industries—such as healthcare, retail, logistics, and financial services—require continuous five- or seven-day coverage, meaning reduced schedules could either delay customer responses or force firms to hire additional staff at significant cost (Vance, 2023). Additionally, Vance (2023) cautions that squeezing an unchanged five-day workload into four days may intensify daily time pressure and inadvertently accelerate burnout. However, these challenges stem from rigid scheduling rather than an inherent flaw in the four-day model itself. Instead of closing operations entirely on the same day, service-oriented companies can implement staggered shifts so that full weekly coverage is preserved while each employee still enjoys a three-day weekend. Meanwhile, pairing the transition with workflow streamlining—as recommended by Lindqvist (2022)—ensures that unnecessary tasks are removed rather than compressed, allowing firms to safeguard both service continuity and staff well-being.", "In conclusion, weighing both personal health benefits and corporate performance demonstrates that adopting a four-day workweek without pay cuts is a forward-looking strategy for modern enterprises. Although industries with continuous service demands must plan carefully to prevent workload compression and staffing gaps, flexible shift rotations and outcome-based management can effectively resolve these obstacles. By embracing a smarter, rest-inclusive schedule, organizations can simultaneously foster healthier employees and build more resilient, productive workplaces."], "modelTransitions": ["To understand why a shorter schedule outperforms conventional working arrangements, it is first necessary to examine its impact on employees' physical and psychological health.", "Beyond enhancing individual well-being, transitioning to a four-day workweek also yields measurable operational and financial advantages for employers.", "Nevertheless, implementing a four-day workweek with full pay is not without operational drawbacks.", "However, these challenges stem from rigid scheduling rather than an inherent flaw in the four-day model itself.", "In conclusion, weighing both personal health benefits and corporate performance demonstrates that"]}};
const READINGS = [{"id": "r1", "tag": "Band 7 · Engineering", "title": "The Development of the London Underground", "source": "GitHub: LuchoBazz/ielts-ai-dataset (CC BY 4.0)", "paragraphs": ["(A) By the mid-19th century, London was experiencing unprecedented demographic growth, making it the largest city in the world. This rapid expansion brought immense wealth, but it also resulted in severe traffic congestion. The streets were choked with horse-drawn omnibuses, carts, and pedestrians, leading to near-paralysis of the city’s transport network. Charles Pearson, a visionary City of London solicitor, recognized that a radical solution was necessary. In 1845, he proposed the construction of an underground railway to link the mainline railway termini and clear the slums. Though initially met with skepticism and mocked by the press, Pearson’s relentless campaigning eventually secured parliamentary approval and the necessary funding from private investors.", "(B) The first underground line, the Metropolitan Railway, opened in January 1863. It was a marvel of Victorian engineering, built using a technique known as \"cut-and-cover.\" This involved digging a massive trench along the route of existing streets, constructing brick walls and a vaulted roof, and then restoring the road surface above. While effective, the cut-and-cover method caused immense disruption. Hundreds of buildings were demolished, and local businesses suffered heavily during the construction phase. Despite these challenges, the railway was an instant success, carrying 38,000 passengers on its opening day in wooden carriages pulled by steam locomotives.", "(C) The use of steam engines underground, however, created significant environmental problems. Despite the installation of ventilation shafts, the tunnels were constantly filled with dense, sulfurous smoke, which blackened the stations and occasionally caused passengers to choke. It was clear that a new approach was needed. The solution arrived in the 1890s with the invention of the Greathead tunneling shield by engineer James Henry Greathead. This cylindrical steel shield allowed workers to excavate deep underground without disturbing the surface, paving the way for the \"deep-level tube\" lines.", "(D) These new tube lines were smaller in diameter and naturally suited to electric traction, which eliminated the smoke problem entirely. The City and South London Railway, opening in 1890, was the first deep-level, electrically operated railway in the world. However, the early tube network was chaotic, operated by several competing private companies. It wasn’t until the early 1900s that American financier Charles Yerkes managed to unify most of the separate lines under a single corporate umbrella, the Underground Electric Railways Company of London (UERL). Yerkes orchestrated the electrification of the older steam lines and funded the rapid expansion of the tube network into the growing suburbs.", "(E) During the Second World War, the London Underground took on an entirely new and unexpected role. As the Blitz devastated the capital, hundreds of thousands of Londoners sought refuge from aerial bombardment by sleeping on the platforms and tracks of the deep-level stations. The government, initially opposed to the idea due to fears of disease and panic, eventually formalized the arrangement, providing bunk beds, chemical toilets, and even library services underground.", "(F) Today, the London Underground remains a vital artery of the city, handling over a billion passenger journeys annually. While modern infrastructure projects like the Elizabeth line have transformed travel times across the capital, the foundational engineering of Pearson, Greathead, and Yerkes continues to underpin one of the most famous transit systems in the world."], "groups": [{"type": "true-false-not-given", "instructions": "Do the following statements agree with the information given in the passage? Write TRUE, FALSE, or NOT GIVEN.", "word_limit": "", "word_bank": [], "questions": [{"num": 1, "text": "Charles Pearson personally provided all the funding for the Metropolitan Railway.", "answer": "FALSE", "accepted": ["FALSE", "False", "false"], "options": []}, {"num": 2, "text": "The cut-and-cover construction method severely disrupted street-level businesses.", "answer": "TRUE", "accepted": ["TRUE", "True", "true"], "options": []}, {"num": 3, "text": "The first deep-level tube line was financially successful in its opening year.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN", "Not Given", "not given"], "options": []}, {"num": 4, "text": "The British government immediately encouraged citizens to use the Underground as air-raid shelters.", "answer": "FALSE", "accepted": ["FALSE", "False", "false"], "options": []}]}, {"type": "short-answer", "instructions": "Answer the questions below. Choose NO MORE THAN THREE WORDS from the passage for each answer.", "word_limit": "3", "word_bank": [], "questions": [{"num": 10, "text": "What source of power was used for the locomotives on the opening day in 1863?", "answer": "steam", "accepted": ["steam", "steam engines"], "options": []}, {"num": 11, "text": "What was installed in the early tunnels in an attempt to alleviate the smoke problem?", "answer": "ventilation shafts", "accepted": ["ventilation shafts"], "options": []}, {"num": 12, "text": "What primary alternative function did underground stations serve during the Blitz?", "answer": "air-raid shelters", "accepted": ["air-raid shelters", "refuge"], "options": []}, {"num": 13, "text": "Which contemporary infrastructure project has notably transformed travel times in London?", "answer": "Elizabeth line", "accepted": ["Elizabeth line", "the Elizabeth line"], "options": []}]}]}, {"id": "r2", "tag": "Band 7 · Acoustics", "title": "The Architecture of Sound: Acoustics in Concert Halls", "source": "GitHub: LuchoBazz/ielts-ai-dataset (CC BY 4.0)", "paragraphs": ["(A) Until the late 19th century, the acoustic success of a concert hall was largely a matter of architectural luck. Builders relied on intuition and imitation of existing successful venues. The scientific study of room acoustics only began in earnest in 1895 when Wallace Clement Sabine, a physics professor at Harvard University, was asked to fix the terrible acoustics of the Fogg Art Museum's lecture hall. Through rigorous experimentation using organ pipes and stopwatches, Sabine discovered that the duration a sound lingers in a room—which he termed \"reverberation time\"—is mathematically related to the room's volume and the sound-absorbing properties of its surfaces.", "(B) Reverberation time (RT) quickly became the foundational metric of acoustic design. The optimal RT depends entirely on the purpose of the space. For spoken word or rapid, intricate chamber music, a short RT (around 1 to 1.5 seconds) is preferred to maintain clarity, ensuring that rapid notes do not bleed into one another. Conversely, large symphonic works, such as those by Wagner or Mahler, benefit from a longer RT (around 2 to 2.2 seconds). This extended decay allows the sounds of dozens of instruments to blend into a rich, immersive sonic wash, giving the music a sense of warmth and grandeur.", "(C) Historically, the most consistently praised concert halls—such as the Musikverein in Vienna and the Concertgebouw in Amsterdam—share a common architectural shape: the \"shoebox.\" Characterized by a rectangular floor plan, high ceilings, and narrow width, the shoebox design naturally creates excellent acoustic conditions. Its secret lies in \"lateral reflections.\" Because the side walls are relatively close together, sound waves reflecting off them reach the listener’s ears from the sides just milliseconds after the direct sound from the stage. These lateral reflections are interpreted by the human brain as a sense of spaciousness and envelopment, making the listener feel surrounded by the music.", "(D) Despite the proven reliability of the shoebox, the mid-20th century saw a shift toward \"vineyard\" style halls, pioneered by Hans Scharoun’s Berlin Philharmonie in 1963. In a vineyard hall, the seating is divided into steep terraces surrounding the stage on all sides. This design was driven primarily by a desire for visual intimacy and democratic seating, bringing the audience closer to the performers. However, the lack of parallel side walls removes the natural lateral reflections found in shoebox halls. To compensate, acousticians must intricately design the terraced walls and suspend reflective panels from the ceiling to artificially direct sound outward to the audience.", "(E) Modern acousticians no longer rely on guesswork. Before a single brick is laid, contemporary concert halls undergo rigorous virtual and physical testing. Engineers use advanced computer software to trace the path of thousands of simulated sound rays, calculating how they bounce, scatter, and decay. Furthermore, highly detailed physical scale models are built (often at a 1:10 scale) and filled with nitrogen gas to correct for sound wave scaling. By recording miniature sound sources inside these models, acousticians can use a process called \"auralization\" to listen to what the finished hall will sound like, allowing them to adjust the angle of a balcony or the material of a wall to optimize the acoustics.", "(F) Yet, despite the sophistication of modern acoustic science, the perception of sound remains inherently subjective. Psychologists have noted that an audience’s visual environment significantly alters their acoustic evaluation. A hall decorated in warm woods and rich reds is often perceived as having a \"warmer\" sound than a visually stark, concrete hall, even if their objective acoustic measurements are identical. Ultimately, the architecture of sound is not just about physics; it is deeply intertwined with human psychology and expectation."], "groups": [{"type": "matching-headings", "instructions": "The reading passage has six paragraphs, A–F. Choose the correct heading for each paragraph from the list of headings below.", "word_limit": "", "word_bank": [{"id": "i. Visual intimacy versus acoustic complexity", "text": "i. Visual intimacy versus acoustic complexity"}, {"id": "ii. Measuring and optimizing sound decay", "text": "ii. Measuring and optimizing sound decay"}, {"id": "iii. The enduring success of a traditional shape", "text": "iii. The enduring success of a traditional shape"}, {"id": "iv. How non-auditory factors affect listening", "text": "iv. How non-auditory factors affect listening"}, {"id": "v. The origins of architectural acoustics", "text": "v. The origins of architectural acoustics"}, {"id": "vi. The failure of computer modeling in modern design", "text": "vi. The failure of computer modeling in modern design"}, {"id": "vii. The role of modern technology in hall design", "text": "vii. The role of modern technology in hall design"}, {"id": "viii. Why symphonies are harder to perform than chamber music", "text": "viii. Why symphonies are harder to perform than chamber music"}], "questions": [{"num": 14, "text": "Paragraph A", "answer": "v", "accepted": ["v"], "options": []}, {"num": 15, "text": "Paragraph B", "answer": "ii", "accepted": ["ii"], "options": []}, {"num": 16, "text": "Paragraph C", "answer": "iii", "accepted": ["iii"], "options": []}, {"num": 17, "text": "Paragraph D", "answer": "i", "accepted": ["i"], "options": []}, {"num": 18, "text": "Paragraph E", "answer": "vii", "accepted": ["vii"], "options": []}, {"num": 19, "text": "Paragraph F", "answer": "iv", "accepted": ["iv"], "options": []}]}, {"type": "matching-information", "instructions": "Which paragraph contains the following information? Write the correct letter, A–F.", "word_limit": "", "word_bank": [], "questions": [{"num": 20, "text": "A reference to the earliest scientific measurements of room acoustics.", "answer": "A", "accepted": ["A"], "options": []}, {"num": 21, "text": "An explanation of why narrow concert halls produce superior sound envelopment.", "answer": "C", "accepted": ["C"], "options": []}, {"num": 22, "text": "Examples of techniques used by acousticians to predict sound before construction.", "answer": "E", "accepted": ["E"], "options": []}, {"num": 23, "text": "The idea that what an audience sees visually can alter their evaluation of sound.", "answer": "F", "accepted": ["F"], "options": []}]}, {"type": "multiple-choice", "instructions": "Choose the correct letter, A, B, C or D.", "word_limit": "", "word_bank": [], "questions": [{"num": 24, "text": "According to the passage, the \"shoebox\" design is acoustically successful primarily because:", "answer": "B", "accepted": ["B"], "options": [{"id": "A", "text": "A. The high ceilings reduce the need for reverberation time."}, {"id": "B", "text": "B. It provides strong lateral sound reflections to the audience."}, {"id": "C", "text": "C. It allows for more democratic and visually intimate seating."}, {"id": "D", "text": "D. It limits the blending of large symphonic instruments."}]}, {"num": 25, "text": "The \"vineyard\" style of concert hall was originally developed to:", "answer": "C", "accepted": ["C"], "options": [{"id": "A", "text": "A. Maximize the natural lateral reflections of sound."}, {"id": "B", "text": "B. Lower the cost of construction by removing parallel walls."}, {"id": "C", "text": "C. Improve the audience’s visual connection to the performers."}, {"id": "D", "text": "D. Create a warmer sound using steep wooden terraces."}]}, {"num": 26, "text": "What does the passage say about reverberation time (RT)?", "answer": "A", "accepted": ["A"], "options": [{"id": "A", "text": "A. Different genres of music require different optimal RTs."}, {"id": "B", "text": "B. A long RT is always preferable to a short RT."}, {"id": "C", "text": "C. RT was primarily used to fix the Fogg Art Museum."}, {"id": "D", "text": "D. A short RT helps blend the sound of large symphonic works."}]}, {"num": 27, "text": "The writer’s overall conclusion about concert hall acoustics is that:", "answer": "D", "accepted": ["D"], "options": [{"id": "A", "text": "A. Computer modeling will eventually make physical testing obsolete."}, {"id": "B", "text": "B. The shoebox design is no longer relevant for modern orchestras."}, {"id": "C", "text": "C. Visual aesthetics are more important than physical acoustics."}, {"id": "D", "text": "D. It remains a complex blend of objective science and subjective perception."}]}]}]}, {"id": "r3", "tag": "Band 7 · Zoology", "title": "The Evolutionary Puzzle of Animal Play", "source": "GitHub: LuchoBazz/ielts-ai-dataset (CC BY 4.0)", "paragraphs": ["(A) Watch a litter of wolf pups wrestling, or a group of juvenile dolphins riding the bow wave of a boat, and the concept of \"play\" seems intuitively obvious. Yet, for decades, evolutionary biologists found animal play deeply perplexing. In the harsh reality of natural selection, behavior is typically highly efficient, optimized for finding food, avoiding predators, and reproducing. Play, by contrast, appears to be a colossal waste of energy. Furthermore, animals engaged in play are often distracted and noisy, making them significantly more vulnerable to predation. Given these high costs, play must confer a substantial evolutionary advantage, or natural selection would have eliminated it long ago.", "(B) Defining play scientifically is notoriously difficult. The widely accepted framework proposed by Gordon Burghardt establishes several criteria: the behavior must not be fully functional in the context in which it is expressed; it must be voluntary and rewarding; it differs from \"serious\" behavior in form or timing; and it must be performed repeatedly when the animal is healthy and free from immediate stress. Having defined play, scientists have spent years formulating and testing hypotheses regarding its evolutionary function.", "(C) The most traditional explanation is the \"Motor Training\" hypothesis. This suggests that play, particularly locomotor play like running and leaping, helps young animals develop the physical strength, coordination, and neurological wiring necessary for adult survival. While logical, empirical support for this theory is surprisingly mixed. A long-term study of wild meerkats revealed that individuals who engaged in high levels of play-fighting as juveniles were not any more successful at winning real fights or hunting prey as adults. The motor benefits of play, it seems, may be overstated or easily acquired through standard, non-playful movement.", "(D) Another prominent theory is the \"Social Cohesion\" hypothesis. Many highly social mammals, such as rats, chimpanzees, and wolves, engage in extensive social play. This behavior is thought to establish social hierarchies, teach social rules, and forge bonds that hold the group together. During play fighting, animals learn to communicate their intentions and differentiate between a playful nip and an aggressive bite. They learn the boundaries of acceptable behavior, which reduces the likelihood of lethal aggression within the group later in life.", "(E) Recently, a compelling new framework has emerged: the \"Cognitive Flexibility\" hypothesis, championed by Marek Spinka and his colleagues. This theory proposes that play serves to train animals for the unexpected. Wild animals exist in unpredictable environments where a sudden loss of balance or an unexpected attack can be fatal. During play, animals deliberately handicap themselves. They put themselves in disadvantageous positions—rolling on their backs, purposefully losing their balance, or allowing a smaller peer to \"win\" a mock fight. Spinka argues that by actively seeking out and experiencing these minor physical and emotional shocks in a safe environment, animals learn to recover quickly. Play, therefore, is essentially a biological rehearsal for emergencies, building resilience and neurological flexibility.", "(F) Ultimately, the motivation for an animal to risk energy and safety for play boils down to neurochemistry. When mammals play, their brains release high levels of dopamine and endogenous opioids—the brain’s natural reward chemicals. Play feels intrinsically good. If the evolutionary benefits of play (whether cognitive flexibility, social bonding, or physical conditioning) were not reinforced by immediate, powerful feelings of pleasure, young animals simply would not take the risk. As research deepens, it becomes clear that play is not a frivolous byproduct of youth, but a deeply embedded, neurologically driven strategy for survival in an unpredictable world."], "groups": [{"type": "yes-no-not-given", "instructions": "Do the following statements agree with the claims of the writer? Write YES, NO, or NOT GIVEN.", "word_limit": "", "word_bank": [], "questions": [{"num": 28, "text": "Engaging in play behavior reduces an animal’s risk of being attacked by predators.", "answer": "NO", "accepted": ["NO", "No", "no"], "options": []}, {"num": 29, "text": "Gordon Burghardt established a widely accepted framework for defining animal play.", "answer": "YES", "accepted": ["YES", "Yes", "yes"], "options": []}, {"num": 30, "text": "Meerkat pups that play more frequently become more successful hunters as adults.", "answer": "NO", "accepted": ["NO", "No", "no"], "options": []}, {"num": 31, "text": "Male animals generally spend a greater proportion of their time playing than female animals.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN", "Not Given", "not given"], "options": []}]}, {"type": "matching-sentence-endings", "instructions": "Complete each sentence with the correct ending, A–F, from the box below.", "word_limit": "", "word_bank": [], "questions": [{"num": 32, "text": "The 'Motor Training' hypothesis assumes that play helps young animals", "answer": "A", "accepted": ["A"], "options": [{"id": "A", "text": "develop crucial physical skills needed for adulthood."}, {"id": "B", "text": "practice recovering from sudden or stressful situations."}, {"id": "C", "text": "establish and maintain complex social hierarchies."}, {"id": "D", "text": "are motivated to participate despite the survival risks."}, {"id": "E", "text": "consume excess calories in an environment with abundant food."}, {"id": "F", "text": "differentiate between true aggression and harmless interaction."}]}, {"num": 33, "text": "Play fighting in highly social species like wolves helps to", "answer": "C", "accepted": ["C"], "options": [{"id": "A", "text": "develop crucial physical skills needed for adulthood."}, {"id": "B", "text": "practice recovering from sudden or stressful situations."}, {"id": "C", "text": "establish and maintain complex social hierarchies."}, {"id": "D", "text": "are motivated to participate despite the survival risks."}, {"id": "E", "text": "consume excess calories in an environment with abundant food."}, {"id": "F", "text": "differentiate between true aggression and harmless interaction."}]}, {"num": 34, "text": "According to the 'Cognitive Flexibility' hypothesis, animals play in order to", "answer": "B", "accepted": ["B"], "options": [{"id": "A", "text": "develop crucial physical skills needed for adulthood."}, {"id": "B", "text": "practice recovering from sudden or stressful situations."}, {"id": "C", "text": "establish and maintain complex social hierarchies."}, {"id": "D", "text": "are motivated to participate despite the survival risks."}, {"id": "E", "text": "consume excess calories in an environment with abundant food."}, {"id": "F", "text": "differentiate between true aggression and harmless interaction."}]}, {"num": 35, "text": "The release of neurochemicals like dopamine during play ensures that animals", "answer": "D", "accepted": ["D"], "options": [{"id": "A", "text": "develop crucial physical skills needed for adulthood."}, {"id": "B", "text": "practice recovering from sudden or stressful situations."}, {"id": "C", "text": "establish and maintain complex social hierarchies."}, {"id": "D", "text": "are motivated to participate despite the survival risks."}, {"id": "E", "text": "consume excess calories in an environment with abundant food."}, {"id": "F", "text": "differentiate between true aggression and harmless interaction."}]}]}]}, {"id": "r4", "tag": "Band 8 · Science & History", "title": "The Enigma of the Antikythera Mechanism", "source": "GitHub: LuchoBazz/ielts-ai-dataset (CC BY 4.0)", "paragraphs": ["(A) In the spring of 1900, a group of Greek sponge divers sheltering from a violent storm near the diminutive island of Antikythera stumbled upon a Roman shipwreck. Among the exquisite marble statues, amphorae, and glassware retrieved from the seabed was a heavily encrusted, calcified lump of bronze that initially garnered little attention. It was not until 1902 that archaeologist Valerios Stais noticed a gear wheel protruding from the fractured rock. This serendipitous observation would eventually unmask the Antikythera Mechanism, a device so technologically precocious that it would permanently rewrite the annals of ancient engineering.", "(B) For decades, the true nature of the mechanism remained shrouded in conjecture. The corroded state of the bronze fragments defied physical dismantling, and early scholars were deeply skeptical that classical antiquity possessed the metallurgical prowess required to fashion such intricate gearing. The predominant consensus posited that it was an astrolabe, though its internal complexity seemed disproportionately sophisticated. It wasn't until the 1950s that British science historian Derek J. de Solla Price initiated a systematic examination using gamma-ray radiography. Price's pioneering analysis revealed an interlocking network of gear trains, leading him to characterize the artifact as an ancient analogue computer capable of calculating astronomical positions.", "(C) The technological paradigm shift arrived in 2006, when the Antikythera Mechanism Research Project (AMRP) utilized specialized microfocus X-ray computed tomography (CT) and polynomial texture mapping. This non-destructive 3D imaging penetrated the dense calcification, exposing internal gear teeth as small as a millimeter and revealing microscopic instructional inscriptions on the casing. The data confirmed that the mechanism was a highly sophisticated astronomical calculator, utilizing an epicyclic differential gear system—a mechanical arrangement previously thought to have been invented in the 16th century—to model the erratic orbital motion of the Moon.", "(D) The mechanism's front dial tracked the solar year and the zodiac, utilizing a complex system of pointers to indicate the positions of the Sun, the Moon, and likely the five planets known to antiquity. More remarkably, a dual-dial system on the rear calculated the 235-month Metonic cycle, which aligns lunar months with solar years, alongside the 223-month Saros cycle, a remarkably precise period utilized for predicting both solar and lunar eclipses. The inclusion of a smaller dial specifically tracking the four-year cycle of the Panhellenic Games, including the Olympics, underscores the profound intersection of astronomy, civic life, and religion in ancient Hellenistic society.", "(E) Despite these revelations, tantalizing questions endure. The origin of the mechanism remains heavily contested. While the shipwreck dates to circa 70-60 BCE, typographic analysis of the inscriptions suggests the device may have been constructed decades earlier, potentially placing its creation in the intellectual milieu of Rhodes, home to the eminent astronomer Hipparchus, or Syracuse, the domain of Archimedes. Furthermore, the absence of antecedent or immediate descendant devices in the archaeological record poses a profound anomaly. Was this a unique masterpiece, or simply the sole survivor of a widespread, robust mechanical tradition that perished in the ensuing centuries?"], "groups": [{"type": "true-false-not-given", "instructions": "Do the following statements agree with the information given in Reading Passage 1? Write TRUE, FALSE, or NOT GIVEN.", "word_limit": "", "word_bank": [], "questions": [{"num": 1, "text": "The sponge divers deliberately travelled to the island of Antikythera to search for ancient artifacts.", "answer": "FALSE", "accepted": ["FALSE", "False", "false"], "options": []}, {"num": 2, "text": "Valerios Stais was the first person to realize the bronze lump contained mechanical parts.", "answer": "TRUE", "accepted": ["TRUE", "True", "true"], "options": []}, {"num": 3, "text": "Early scholars believed the mechanism was originally encased in a wooden box.", "answer": "NOT GIVEN", "accepted": ["NOT GIVEN", "Not Given", "not given"], "options": []}, {"num": 4, "text": "Derek J. de Solla Price utilized microfocus X-ray computed tomography for his investigations.", "answer": "FALSE", "accepted": ["FALSE", "False", "false"], "options": []}, {"num": 5, "text": "The artifact was capable of forecasting the dates of the Olympic Games.", "answer": "TRUE", "accepted": ["TRUE", "True", "true"], "options": []}]}, {"type": "short-answer", "instructions": "Answer the questions below. Choose NO MORE THAN THREE WORDS from the passage for each answer.", "word_limit": "3", "word_bank": [], "questions": [{"num": 11, "text": "What phenomenon did the epicyclic gear system help to model?", "answer": "erratic orbital motion", "accepted": ["erratic orbital motion", "orbital motion"], "options": []}, {"num": 12, "text": "Which astronomical cycle was monitored to predict eclipses?", "answer": "Saros cycle", "accepted": ["Saros cycle", "the Saros cycle", "223-month Saros cycle"], "options": []}, {"num": 13, "text": "What field of study is suggested as the basis for the mechanism's typographic analysis?", "answer": "typographic analysis", "accepted": ["typographic analysis", "inscriptions"], "options": []}]}]}];

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  const txt = document.getElementById('toast-msg');
  if (!el || !txt) return;
  txt.textContent = msg;
  el.classList.remove('opacity-0');
  el.classList.add('opacity-100');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    el.classList.remove('opacity-100');
    el.classList.add('opacity-0');
  }, 2200);
}

function speakText(text) {
  try {
    if (!('speechSynthesis' in window)) {
      showToast('此瀏覽器不支援語音朗讀');
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.94;
    window.speechSynthesis.speak(u);
  } catch (e) {
    showToast('語音播放失敗');
  }
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('已複製到剪貼簿')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已複製到剪貼簿'); } catch (e) {}
  document.body.removeChild(ta);
}

function highlightEssayHtml(text, transitions) {
  let html = esc(text);
  if (state.highlightTransitions) {
    transitions.forEach(tr => {
      const safeTr = esc(tr);
      if (html.includes(safeTr)) {
        html = html.replace(safeTr, `<span class="mark-transition">${safeTr}</span>`);
      }
    });
    html = html.replace(/(\([A-Z][A-Za-z &amp;]+,\s*\d{4}\))/g, '<span class="mark-apa">$1</span>');
    html = html.replace(/(According to [A-Z][A-Za-z]+(?: and [A-Z][A-Za-z]+)? \(\d{4}\)|As [A-Z][A-Za-z]+(?: and [A-Z][A-Za-z]+)? \(\d{4}\) [a-z]+)/g, '<span class="mark-apa">$1</span>');
  }
  return html;
}

function getFilteredVocab() {
  const all = getAllVocab();
  const q = state.vocabSearch.trim().toLowerCase();
  return all.filter(v => {
    if (state.vocabPage !== 'all') {
      if (state.vocabPage === 'custom' && v.page !== 'custom') return false;
      if (state.vocabPage !== 'custom' && v.page !== Number(state.vocabPage)) return false;
    }
    const isM = !!state.vocabMastered[v.id];
    const stars = Number(state.vocabStars[v.id] || 0);
    if (state.vocabFilter === 'mastered' && !isM) return false;
    if (state.vocabFilter === 'learning' && isM) return false;
    if (state.vocabFilter === 'starred' && stars <= 0) return false;
    if (q && !(v.word + ' ' + v.zh + ' ' + v.def + ' ' + (v.note || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function generateVocabQuiz() {
  const all = getAllVocab();
  const target = all[Math.floor(Math.random() * all.length)];
  const distractors = all.filter(v => v.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [target, ...distractors].sort(() => Math.random() - 0.5);
  state.vQuizQ = { target, options };
  state.vQuizSelected = null;
}

function normalizeAns(s) {
  return String(s || '').trim().toLowerCase().replace(/[.,!?;:'"()]/g, '').replace(/\s+/g, ' ');
}

function isCorrectReadingQ(q, userVal) {
  const u = normalizeAns(userVal);
  if (!u) return false;
  const accepted = (q.accepted && q.accepted.length ? q.accepted : [q.answer]).map(normalizeAns);
  if (accepted.includes(u)) return true;
  // For matching-headings where option text starts with roman numeral e.g. "v. ..."
  const ansNorm = normalizeAns(q.answer);
  if (u.startsWith(ansNorm + ' ') || u === ansNorm) return true;
  return false;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

    allQs.forEach(q => { if (isCorrectReadingQ(q, ansMap[q.num])) score++; });
  }

          </div>
        ` : ''}

        <div class="space-y-5">
          ${r.groups.map((g, gIdx) => `
            <div class="space-y-3 ${gIdx > 0 ? 'pt-4 border-t border-stone-100 dark:border-slate-800' : ''}">
              <div class="text-xs font-semibold text-indigo-700 dark:text-indigo-400 bg-indigo-50/70 dark:bg-indigo-950/30 p-2.5 rounded-xl leading-relaxed">

                </div>
              ` : ''}
              ${g.questions.map(q => renderReadingQuestion(r.id, g, q, ansMap[q.num] || '', submitted)).join('')}
            </div>
          `).join('')}
        </div>

        ${!submitted ? `
          <button id="btn-r-submit" class="mt-5 w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-semibold shadow-sm hover:bg-indigo-700 transition">交卷並對答案</button>
        ` : ''}
      </div>
    </div>
  `;

  container.querySelectorAll('button[data-rid]').forEach(b => {
    b.addEventListener('click', () => {
      state.readingId = b.dataset.rid;
      saveState();
      renderReading(container);
    });
  });
  container.querySelectorAll('button[data-rfont]').forEach(b => {
    b.addEventListener('click', () => {
      state.readingFont = b.dataset.rfont;
      saveState();
      renderReading(container);
    });
  });
  container.querySelectorAll('button[data-mpane]').forEach(b => {
    b.addEventListener('click', () => {
      state.readingMobilePane = b.dataset.mpane;
      renderReading(container);
    });
  });
  container.querySelectorAll('p[data-mark-p]').forEach(p => {
    p.addEventListener('click', () => {
      const idx = Number(p.dataset.markP);
      const arr = state.readingMarks[r.id] ? [...state.readingMarks[r.id]] : [];
      const pos = arr.indexOf(idx);
      if (pos >= 0) arr.splice(pos, 1); else arr.push(idx);
      state.readingMarks[r.id] = arr;
      saveState();
      renderReading(container);
    });
  });

  // Timer controls
  container.querySelector('#btn-timer-toggle').addEventListener('click', () => {
    state.timerRunning = !state.timerRunning;
    if (state.timerRunning) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.timerSec > 0) {
          state.timerSec--;
          const td = document.getElementById('timer-display');
          if (td) td.textContent = formatTime(state.timerSec);
        } else {
          clearInterval(timerInterval);
          state.timerRunning = false;
          showToast('20 分鐘時間到！');
          renderReading(container);
        }
      }, 1000);
    } else {
      clearInterval(timerInterval);
    }
    renderReading(container);
  });
  container.querySelector('#btn-timer-reset').addEventListener('click', () => {
    clearInterval(timerInterval);
    state.timerRunning = false;
    state.timerSec = 1200;
    renderReading(container);
  });
  container.querySelector('#btn-reading-addword').addEventListener('click', () => {
    const sel = (window.getSelection ? window.getSelection().toString() : '').trim();
    openAddVocabModal(sel.length <= 40 ? sel : '');
  });

  // Question inputs
  container.querySelectorAll('[data-rq-input]').forEach(el => {

      const qnum = el.dataset.rqInput;
      if (!state.readingAnswers[r.id]) state.readingAnswers[r.id] = {};

      renderReading(container);

  });

    state.timerRunning = false;
    saveState();
    renderReading(container);
    showToast('已交卷批改！');
  });
  const retryBtn = container.querySelector('#btn-r-retry');
  if (retryBtn) retryBtn.addEventListener('click', () => {
    state.readingSubmitted[r.id] = false;
    state.readingAnswers[r.id] = {};
    saveState();
    renderReading(container);
  });
}

function renderReadingQuestion(rid, group, q, val, submitted) {
  const ok = submitted && isCorrectReadingQ(q, val);
  const statusBadge = submitted
    ? (ok ? `<span class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400">✓ 正確</span>`
          : `<span class="text-[11px] font-bold text-rose-600 dark:text-rose-400">✗ 正解：${esc(q.answer)}</span>`)
    : '';

  let control = '';
  if (group.type === 'true-false-not-given' || group.type === 'yes-no-not-given') {
    const choices = group.type === 'true-false-not-given' ? ['TRUE', 'FALSE', 'NOT GIVEN'] : ['YES', 'NO', 'NOT GIVEN'];
    control = `<div class="grid grid-cols-3 gap-1.5 mt-2">
      ${choices.map(c => {
        const picked = normalizeAns(val) === normalizeAns(c);
        let cls = picked ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-stone-50 dark:bg-slate-800 border-stone-200 dark:border-slate-700 text-slate-700 dark:text-slate-300';
        if (submitted && normalizeAns(c) === normalizeAns(q.answer)) cls = 'bg-emerald-600 text-white border-emerald-600';
        else if (submitted && picked && !ok) cls = 'bg-rose-600 text-white border-rose-600';
        return `<button type="button" data-rq-num="${q.num}" data-rq-choice="${c}" class="py-1.5 rounded-lg border text-[11px] font-semibold transition ${cls}">${c}</button>`;
      }).join('')}
    </div>`;
  } else if (group.type === 'multiple-choice' || group.type === 'matching-sentence-endings') {
    control = `<div class="space-y-1.5 mt-2">
      ${q.options.map(o => {
        const picked = normalizeAns(val) === normalizeAns(o.id);
        let cls = picked ? 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-500 text-indigo-800 dark:text-indigo-200 font-medium' : 'bg-stone-50 dark:bg-slate-800/70 border-stone-200 dark:border-slate-700';
        if (submitted && normalizeAns(o.id) === normalizeAns(q.answer)) cls = 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-medium';
        else if (submitted && picked && !ok) cls = 'bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-700 dark:text-rose-300';
        return `<button type="button" data-rq-num="${q.num}" data-rq-choice="${esc(o.id)}" class="w-full text-left px-3 py-2 rounded-lg border text-xs transition ${cls}">${esc(o.text.startsWith(o.id + '.') ? o.text : o.id + '. ' + o.text)}</button>`;
      }).join('')}
    </div>`;
  } else if (group.type === 'matching-headings') {
    const romans = ['i','ii','iii','iv','v','vi','vii','viii'];
    control = `<select data-rq-input="${q.num}" ${submitted ? 'disabled' : ''} class="mt-2 w-full px-3 py-2 rounded-lg bg-stone-50 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-xs">
      <option value="">-- 選擇段落標題 --</option>
      ${romans.map(rm => `<option value="${rm}" ${normalizeAns(val) === rm ? 'selected' : ''}>${rm}</option>`).join('')}
    </select>`;
  } else if (group.type === 'matching-information') {
    const letters = ['A','B','C','D','E','F'];
    control = `<div class="grid grid-cols-6 gap-1.5 mt-2">
      ${letters.map(lt => {
        const picked = normalizeAns(val) === normalizeAns(lt);
        let cls = picked ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-stone-50 dark:bg-slate-800 border-stone-200 dark:border-slate-700';
        if (submitted && normalizeAns(lt) === normalizeAns(q.answer)) cls = 'bg-emerald-600 text-white border-emerald-600';
        return `<button type="button" data-rq-num="${q.num}" data-rq-choice="${lt}" class="py-1.5 rounded-lg border text-xs font-semibold ${cls}">${lt}</button>`;
      }).join('')}
    </div>`;
  } else {
    control = `<input type="text" data-rq-input="${q.num}" value="${esc(val)}" ${submitted ? 'disabled' : ''} placeholder="輸入英文答案..." class="mt-2 w-full px-3 py-2 rounded-lg bg-stone-50 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" />`;
  }

  return `
    <div class="p-3 rounded-xl border ${submitted ? (ok ? 'border-emerald-300 dark:border-emerald-900/60 bg-emerald-50/20' : 'border-rose-300 dark:border-rose-900/60 bg-rose-50/20') : 'border-stone-200 dark:border-slate-800'}">
      <div class="flex items-start justify-between gap-2 text-xs sm:text-sm">
        <span><b class="text-indigo-600 dark:text-indigo-400">Q${q.num}.</b> ${esc(q.text)}</span>
        <span class="shrink-0">${statusBadge}</span>
      </div>
      ${control}
    </div>
  `;
}

function normalizeWordKey(w) {
  return String(w || '').trim().toLowerCase().replace(/[^a-z\s-]/g, '').replace(/\s+/g, ' ').trim();
}

function upsertVocabEntry({ word, pos, zh, def, note }) {
  const key = normalizeWordKey(word);
  const existing = getAllVocab().find(v => normalizeWordKey(v.word) === key);
  if (existing) {
    state.vocabStars[existing.id] = (state.vocabStars[existing.id] || 0) + 1;
    return { duplicate: true, matchedWord: existing.word, stars: state.vocabStars[existing.id] };
  }
  state.customVocab.unshift({
    id: 'cv_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    page: 'custom',
    word: word.trim(),
    pos: (pos || 'n./v.').trim(),
    zh: (zh || '拍照收錄（可點擊補充中文）').trim(),
    def: (def || zh || 'Captured from vocab notebook photo').trim(),
    note: note || '拍照辨識收錄',
    ex: ''
  });
  return { duplicate: false };
}

function parseVocabLines(rawText) {
  const lines = String(rawText || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const entries = [];
  for (const line of lines) {
    // Match "word (pos) : definition" or "word : definition" or "word - definition"
    const m = line.match(/^([A-Za-z][A-Za-z\s-]{1,34}?)(?:\s*\(([^)]+)\))?\s*[:：\-–]\s*(.+)$/);
    if (m) {
      const w = m[1].trim();
      const pos = (m[2] || '').trim() || 'n./v.';
      const rest = m[3].trim();
      entries.push({ word: w, pos, zh: rest, def: rest });
    } else if (/^[A-Za-z][A-Za-z\s-]{1,28}$/.test(line)) {
      entries.push({ word: line.trim(), pos: 'n./v.', zh: '拍照收錄', def: 'Captured from vocab notebook' });
    }
  }
  return entries;
}

      <textarea id="ocr-textarea" rows="6" placeholder="拍照後會自動填入辨識文字，你也可以直接微調手寫辨識錯字或手動貼上多行單字，例如：&#10;rigid (adj.): 僵化的&#10;mitigate (v.): 減緩、緩和" class="w-full p-2.5 rounded-xl bg-stone-50 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-xs font-mono leading-relaxed"></textarea>

      <button type="button" id="m-cancel" class="px-4 py-2 rounded-xl bg-stone-100 dark:bg-slate-800 text-xs font-medium">取消</button>

  const ta = document.getElementById('ocr-textarea');
  const dupHint = document.getElementById('ocr-dup-hint');

  function updateDupPreview() {
    const parsed = parseVocabLines(ta.value);
    if (!parsed.length) { dupHint.textContent = ''; return; }
    let dupCount = 0;
    const existingKeys = new Set(getAllVocab().map(v => normalizeWordKey(v.word)));
    parsed.forEach(p => { if (existingKeys.has(normalizeWordKey(p.word))) dupCount++; });
    dupHint.innerHTML = `偵測到 <b>${parsed.length}</b> 個詞條：將新增 <b class="text-emerald-600">${parsed.length - dupCount}</b> 個新詞，為 <b class="text-amber-600">${dupCount}</b> 個重複詞加上 ★ 星標。`;
  }
  ta.addEventListener('input', updateDupPreview);

  async function handleFile(file) {
    if (!file) return;
    const prevWrap = document.getElementById('ocr-preview-wrap');
    const prevImg = document.getElementById('ocr-preview-img');
    const statusEl = document.getElementById('ocr-status');
    prevWrap.classList.remove('hidden');
    prevImg.src = URL.createObjectURL(file);
    statusEl.classList.remove('hidden');
    statusEl.textContent = '正在載入 OCR 辨識引擎並掃描圖片文字...';

    try {
      if (!window.Tesseract) {
        statusEl.textContent = 'OCR 引擎尚未載入完成，請稍候或直接在下方輸入詞條。';
        return;
      }
      const result = await window.Tesseract.recognize(file, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text' && typeof m.progress === 'number') {
            statusEl.textContent = `正在辨識英文生詞... ${Math.round(m.progress * 100)}%`;
          }
        }
      });
      const text = (result && result.data && result.data.text ? result.data.text : '').trim();
      if (text) {
        ta.value = (ta.value ? ta.value + '\n' : '') + text;
        statusEl.textContent = '辨識完成！請快速核對下方手寫辨識文字，確認無誤後點擊「一鍵匯入」。';
        updateDupPreview();
      } else {
        statusEl.textContent = '未能從圖片辨識出清晰英文文字，請嘗試更近距離清晰拍攝或直接手動編輯。';
      }
    } catch (err) {
      statusEl.textContent = '圖片辨識失敗（可能因網路或手寫光線影響），你可以直接在下方輸入或貼上詞條匯入。';
    }
  }

  document.getElementById('ocr-cam').addEventListener('change', e => handleFile(e.target.files[0]));
  document.getElementById('ocr-gallery').addEventListener('change', e => handleFile(e.target.files[0]));

  document.getElementById('btn-ocr-import').addEventListener('click', () => {
    const parsed = parseVocabLines(ta.value);
    if (!parsed.length) {
      showToast('請先拍照辨識或輸入至少一行「單字: 釋義」');
      return;
    }
    let added = 0;
    let starred = [];
    parsed.forEach(entry => {
      const res = upsertVocabEntry({ ...entry, note: '拍照辨識收錄' });
      if (res.duplicate) starred.push(res.matchedWord);
      else added++;
    });
    saveState();
    closeModal();
    renderAll();
    if (starred.length && added) {
      showToast(`已新增 ${added} 詞，並為 ${starred.length} 個重複詞加上 ★ 星標！`);
    } else if (starred.length) {
      showToast(`偵測到 ${starred.length} 個重複詞（${starred.slice(0, 3).join(', ')}），已自動加上 ★！`);
    } else {
      showToast(`已成功新增 ${added} 個生詞！`);
    }
  });
}

function applyContentPack(pack) {
  let eCount = 0, mCount = 0, rCount = 0, vNew = 0, vStar = 0;
  if (Array.isArray(pack.essays)) {
    pack.essays.forEach(e => {
      if (e && e.title && Array.isArray(e.paragraphs)) {
        const id = e.id || ('ce_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
        state.customEssays = (state.customEssays || []).filter(x => x.id !== id);
        state.customEssays.push({ ...e, id, transitions: e.transitions || [], rubric: e.rubric || [] });
        state.essayId = id;
        eCount++;
      }
    });
  }
  if (Array.isArray(pack.mistakes)) {
    pack.mistakes.forEach(m => {
      if (m && m.wrong && m.right) {
        const id = m.id || ('cm_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
        state.customMistakes = (state.customMistakes || []).filter(x => x.id !== id);
        state.customMistakes.push({ ...m, id, cat: m.cat || '語法與主謂一致', freq: m.freq || '新增', essay: m.essay || '新作文' });
        mCount++;
      }
    });
  }
  if (Array.isArray(pack.readings)) {
    pack.readings.forEach(r => {
      if (r && r.title && Array.isArray(r.paragraphs)) {
        const id = r.id || ('cr_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
        state.customReadings = (state.customReadings || []).filter(x => x.id !== id);
        state.customReadings.push({ ...r, id, tag: r.tag || '新增閱讀', groups: r.groups || [] });
        state.readingId = id;
        rCount++;
      }
    });
  }
  if (Array.isArray(pack.vocab)) {
    pack.vocab.forEach(v => {
      if (v && v.word) {
        const res = upsertVocabEntry({ word: v.word, pos: v.pos, zh: v.zh, def: v.def, note: v.note || '更新包匯入' });
        if (res.duplicate) vStar++; else vNew++;
      }
    });
  }
  saveState();
  return { eCount, mCount, rCount, vNew, vStar };
}

function decodeBase64Utf8(b64) {
  const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function openImportPackModal() {
  const ce = state.customEssays || [];
  const cr = state.customReadings || [];
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-base font-bold flex items-center gap-1.5"><i data-lucide="package-plus" class="w-4 h-4 text-indigo-600"></i> 匯入 Gemini 新作文／題目</h3>
      <button id="m-close" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 leading-relaxed">
      每次在 Gemini 批改完新作文或生成新 Reading 題目後，把 Gemini 給你的<b>「更新連結」</b>或<b>「匯入資料碼」</b>貼到下方，按一鍵匯入就能直接更新 App，完全不用重新架站！
    </p>
    <textarea id="pack-input" rows="6" placeholder="貼上 Gemini 給你的更新連結（含 #import=...）或 JSON 更新碼..." class="w-full p-2.5 rounded-xl bg-stone-50 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-xs font-mono mb-3"></textarea>
    <div class="flex items-center justify-between gap-2 mb-3">
      <span class="text-[11px] text-slate-400">已匯入：${ce.length} 篇新作文 · ${cr.length} 篇新閱讀</span>
      <div class="flex gap-2">
        <button type="button" id="m-cancel" class="px-3.5 py-2 rounded-xl bg-stone-100 dark:bg-slate-800 text-xs font-medium">取消</button>
        <button type="button" id="btn-do-import" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">一鍵匯入</button>
      </div>
    </div>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-do-import').addEventListener('click', () => {
    const raw = document.getElementById('pack-input').value.trim();
    if (!raw) { showToast('請先貼上更新連結或資料碼'); return; }
    try {
      let jsonStr = raw;
      if (raw.includes('#import=')) {
        jsonStr = decodeBase64Utf8(raw.split('#import=')[1].trim());
      } else if (!raw.startsWith('{') && !raw.startsWith('[')) {
        jsonStr = decodeBase64Utf8(raw);
      }
      const pack = JSON.parse(jsonStr);
      const r = applyContentPack(pack);
      const total = r.eCount + r.mCount + r.rCount + r.vNew + r.vStar;
      if (!total) { showToast('資料碼內沒有偵測到可匯入的作文、錯題或閱讀內容'); return; }
      closeModal();
      if (r.eCount) state.activeTab = 'essays';
      else if (r.rCount) state.activeTab = 'reading';
      renderAll();
      const parts = [];
      if (r.eCount) parts.push(`${r.eCount} 篇新作文`);
      if (r.mCount) parts.push(`${r.mCount} 條新錯題`);
      if (r.rCount) parts.push(`${r.rCount} 篇新閱讀`);
      if (r.vNew) parts.push(`${r.vNew} 個新生詞`);
      if (r.vStar) parts.push(`${r.vStar} 個重複詞加★`);
      showToast('已成功匯入：' + parts.join('、'));
    } catch (e) {
      showToast('格式不正確，請完整複製 Gemini 提供的連結或資料碼');
    }
  });
}

function checkUrlImport() {
  try {
    const hash = window.location.hash || '';
    if (hash.startsWith('#import=')) {
      const payload = hash.slice('#import='.length);
      const pack = JSON.parse(decodeBase64Utf8(payload));
      const r = applyContentPack(pack);
      if (r.eCount + r.mCount + r.rCount + r.vNew + r.vStar > 0) {
        if (r.eCount) state.activeTab = 'essays';
        else if (r.rCount) state.activeTab = 'reading';
        history.replaceState(null, '', window.location.pathname + window.location.search);
        showToast('已從更新連結自動匯入新內容！');
      }
    }
  } catch (e) {}
}

function openBackupModal() {
  const jsonStr = JSON.stringify({
    masteredMistakes: state.masteredMistakes,
    checklistDone: state.checklistDone,
    vocabMastered: state.vocabMastered,
    vocabStars: state.vocabStars,
    customVocab: state.customVocab,
    readingAnswers: state.readingAnswers,
    readingSubmitted: state.readingSubmitted,
    readingMarks: state.readingMarks
  }, null, 2);
  openModal(`
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-base font-bold">學習進度備份 / 跨裝置同步</h3>
      <button id="m-close" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">在 iPhone 與 iPad 之間切換時，可複製下方 JSON 貼到另一台裝置匯入，同步生詞進度與錯題紀錄。</p>
    <textarea id="bk-area" rows="6" class="w-full p-2.5 rounded-xl bg-stone-50 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 text-[11px] font-mono mb-3">${esc(jsonStr)}</textarea>
    <div class="flex gap-2 justify-end">
      <button id="bk-copy" class="px-3.5 py-2 rounded-xl bg-stone-100 dark:bg-slate-800 text-xs font-medium">複製備份碼</button>
      <button id="bk-import" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">匯入覆蓋進度</button>
    </div>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('bk-copy').addEventListener('click', () => copyText(document.getElementById('bk-area').value));
  document.getElementById('bk-import').addEventListener('click', () => {
    try {
      const obj = JSON.parse(document.getElementById('bk-area').value);
      state = { ...state, ...obj };
      saveState();
      closeModal();
      renderAll();
      showToast('已成功匯入學習進度！');
    } catch (e) {
      showToast('JSON 格式不正確，請重新確認');
    }
  });
}

// ========================
// MAIN RENDER LOOP
// ========================
function renderAll() {
  applyTheme();
  renderNav();
  const main = document.getElementById('app-main');
  if (!main) return;
  if (state.activeTab === 'essays') renderEssays(main);
  else if (state.activeTab === 'mistakes') renderMistakes(main);
  else if (state.activeTab === 'toolkit') renderToolkit(main);
  else if (state.activeTab === 'vocab') renderVocab(main);
  else if (state.activeTab === 'reading') renderReading(main);
  if (window.lucide) lucide.createIcons();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-theme').addEventListener('click', () => {
    state.darkMode = !state.darkMode;
    saveState();
    applyTheme();
    if (window.lucide) lucide.createIcons();
  });
  document.getElementById('btn-import-pack').addEventListener('click', openImportPackModal);
  document.getElementById('btn-backup').addEventListener('click', openBackupModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  checkUrlImport();
  renderAll();
});
</script>
</body>
