const ESSAYS = [{"id": "e1", "shortTitle": "Essay 1 · LBU 教學法", "title": "Secondary School Second Language Teaching: Learning by Using (LBU)", "estGrade": "B- 至 B", "wordCount": "原稿約 430–460 詞 → 修改版約 610 詞", "summary": "立場清晰、成功融合全部三篇文獻（Krogh, Hu, Banciu & Jireghie），主要扣分在於字數偏少、基礎語法硬傷（主謂一致、詞性誤用、拼寫）、APA 寫入期刊全名及原文照搬（Patchwriting）。", "rubric": [{"name": "Task Fulfillment (25%)", "status": "良好，但字數偏少", "note": "立場明確且含完整五段議論文結構；但原稿約 430–460 詞未達 600 詞目標，需補充具體課堂例子深化闡述。"}, {"name": "Discourse Competencies (25%)", "status": "架構清晰，銜接略弱", "note": "段落分工明確（自信心 → 有效路徑 → 讓步反駁），但 Body 1 結尾重複論點，且段與段之間欠缺學術過渡句。"}, {"name": "Source Integration (15%)", "status": "有引用意識，但有抄襲風險", "note": "把期刊全名 The Public Administration and Social Policies Review 寫進正文；多處照搬 Source B/C 詞組未改寫。"}, {"name": "Language Competencies (35%)", "status": "最大失分項", "note": "主謂一致（city connected, LBU allow）、詞性誤用（are lack of, are not dare, learn successful）、中式英語（solid English）與拼寫（tradictional, responisbility）。"}], "paragraphs": [{"label": "引言段 (Introduction)", "issues": [{"bad": "more and more city connected together", "fix": "cities around the world are becoming increasingly interconnected", "cat": "語法與主謂一致", "why": "city 為可數名詞需用複數 cities，且缺少 be 動詞構成被動語態。"}, {"bad": "build up a bridge to build upon bonds", "fix": "build bonds with people from diverse cultural backgrounds", "cat": "詞彙重複", "why": "兩個 build 連用極其累贅，直接精簡為 build bonds 更具學術感。"}, {"bad": "solid second language", "fix": "rigid grammatical rules / inflexible English", "cat": "詞義誤用", "why": "solid 在英文是「扎實、優秀」的褒義詞；你想表達「死板、僵化」應用 rigid 或 inflexible。"}, {"bad": "argues \"learn by use\"(LBU)", "fix": "the \"learning by using\" (LBU) approach", "cat": "詞性與術語規範", "why": "首次提及術語建議寫出完整名稱，並用動名詞 learning 作名詞片語。"}], "revised": "Nowadays, cities around the world are becoming increasingly interconnected. Thus, it is crucial for secondary school students to master a second language to build bonds with people from diverse cultural backgrounds. However, the traditional \"learn to use\" approach only enables students to acquire rigid grammatical rules without achieving oral fluency. This essay argues that the \"learning by using\" (LBU) approach fosters students' confidence and provides an effective learning pathway, thereby leading to successful second language acquisition."}, {"label": "主體段一：自信心與學習動機 (Body 1)", "issues": [{"bad": "First of all", "fix": "Primarily / First", "cat": "學術語氣", "why": "First of all 偏口語，學術議論文建議改用 Primarily 或 First。"}, {"bad": "According to The Public Administration and Social Policies Review... (Banciu & Jireghie, 2012)", "fix": "According to Banciu and Jireghie (2012)", "cat": "APA 規範", "why": "APA 文內引用只需寫作者姓氏與年份，切勿把冗長的期刊全名放進正文。"}, {"bad": "virtual simulating classes / stranger", "fix": "simulated real-life scenarios / strangers", "cat": "詞性與單複數", "why": "表「模擬出來的」應用過去分詞 simulated；stranger 為可數名詞需加複數 -s。"}, {"bad": "結尾三行 Comparing with boring... 與前文重複", "fix": "合併為精煉對比句並加上承上啟下過渡句", "cat": "語篇連貫", "why": "避免同段重複對比枯燥練習與遊戲，改以具體例子（點餐/問路）拉長深度。"}], "revised": "To understand why this communicative approach is superior to traditional instruction, it is first necessary to examine its psychological impact on learners. Primarily, the LBU approach builds students' confidence in learning a second language. According to Banciu and Jireghie (2012), teaching with this communicative method boosts learners' self-assurance because they take greater responsibility for participating in class. In an LBU classroom, teachers create interactive opportunities—such as role-plays, games, and targeted grammar or pronunciation tasks—that place students in a low-anxiety and enjoyable learning atmosphere (Banciu & Jireghie, 2012). Furthermore, LBU incorporates authentic scenarios where students practice conversing with strangers or seeking assistance. For instance, rather than memorizing isolated vocabulary lists, students might simulate ordering food or asking for directions. Compared to monotonous drills and repetitive exercises, these meaningful simulations effectively motivate students to engage with the target language. However, fostering a positive mindset is only the first step; how teachers structure the actual learning process is equally critical."}, {"label": "主體段二：因材施教與有效路徑 (Body 2)", "issues": [{"bad": "直接引用 Krogh (2010) 談 LBU", "fix": "先鋪墊「優秀教師的專業素養」，再銜接至 LBU 課堂實踐", "cat": "邏輯銜接", "why": "Source A (Krogh, 2010) 討論的是優秀教師的通用素養，並未直接提及 LBU，需用自己的話搭建邏輯橋樑。"}, {"bad": "educators simplified the sourced... have a foundational understanding...", "fix": "enabling them to simplify complex concepts so that students can grasp the fundamentals easily", "cat": "句構與詞性", "why": "原句缺少主語與連接詞導致句構崩壞，且 sourced 詞性錯誤，應改為 resources 或 materials。"}, {"bad": "set in-finitive test", "fix": "administering endless tests", "cat": "拼寫與搭配", "why": "in-finitive 拼寫及詞義有誤（想表達「無止盡的考試」應用 endless tests）。"}], "revised": "Beyond enhancing learner motivation, LBU also allows students to acquire a language through a more effective, personalized pathway. As Krogh (2010) notes, effective educators nurture student development by creating a stimulating environment tailored to learners' individual talents and capabilities. In an LBU setting, teachers act as facilitators who assess students' proficiency levels and select appropriate materials to guide them toward their learning goals. Additionally, expert teachers possess strong pedagogical content knowledge, enabling them to simplify complex concepts so that students can grasp the fundamentals easily (Krogh, 2010). Rather than forcing learners to complete repetitive worksheets and endless examinations, educators adopting LBU empower students with suitable resources, preventing the rigid, textbook-bound English often produced by traditional methods. Despite these clear pedagogical advantages, the shift away from rigid, teacher-centered instruction is not without controversy."}, {"label": "主體段三：讓步與反駁 (Counter-argument & Rebuttal)", "issues": [{"bad": "cause jumble to the lessons", "fix": "lead to classroom disorder / disrupt lesson order", "cat": "中式英語", "why": "cause jumble 不符合英文地道搭配，學術寫作建議用 classroom disorder 或 disrupt lesson order。"}, {"bad": "Someone argues", "fix": "Critics argue / Proponents of traditional teaching contend", "cat": "學術語氣", "why": "學術議論文嚴禁口語化的 Someone，需明確指稱立場群體。"}, {"bad": "students are lack of", "fix": "students lack... / there is a lack of...", "cat": "經典語法錯", "why": "lack 作動詞直接接賓語，絕不可寫成 be lack of。"}, {"bad": "students are not dare to express there idea", "fix": "students do not dare to express their ideas", "cat": "語法與拼寫", "why": "be 動詞後不可直接接動詞原形 dare；their 誤拼為 there；idea 需複數。"}, {"bad": "標註 (Banciu & Jireghie, 2012) 但寫 express their own feelings", "fix": "改寫為 learners naturally have ideas they wish to convey", "cat": "文獻準確度", "why": "原文只說 learners have something they want to say or find out，切忌過度腦補原文沒有的細節。"}], "revised": "Although LBU fosters a positive learning atmosphere, critics argue that it may lead to classroom disorder. Proponents of the traditional \"learn to use\" model contend that teacher-dominated instruction ensures predictability and smooth lesson delivery, providing a sense of security for both instructors and learners (Hu, 2010). While strict classroom control indeed maintains order, this hierarchical dynamic often creates an unequal teacher-student relationship and deprives learners of interactive practice. As Banciu and Jireghie (2012) emphasize, the core purpose of language learning is meaningful communication, as learners naturally have ideas they wish to convey. Under rigid, traditional instruction, students often hesitate to speak up; they may excel at written grammar exercises yet remain unable to converse fluently. Therefore, an overly traditional approach is inadequate for achieving true language proficiency, making a balanced adoption of communicative methods all the more imperative."}, {"label": "結論段 (Conclusion)", "issues": [{"bad": "learn second language successful", "fix": "master a second language successfully", "cat": "詞性誤用", "why": "修飾動詞 learn/master 必須使用副詞 successfully。"}, {"bad": "not so predictative than", "fix": "less predictable than", "cat": "拼寫與比較級", "why": "predictable 拼寫錯誤，且與 than 搭配應使用比較級 less predictable than。"}, {"bad": "maintain lesson rules", "fix": "maintain classroom discipline", "cat": "地道搭配", "why": "維持課堂紀律的標準學術搭配為 maintain classroom discipline。"}], "revised": "In conclusion, weighing both the psychological benefits and pedagogical effectiveness demonstrates that the LBU approach, when implemented by skilled educators, enables secondary students to master a second language successfully by building their confidence and providing authentic communicative practice. Although this method is less predictable than traditional instruction, teachers can still establish clear guidelines to maintain classroom discipline while maximizing student engagement."}], "transitions": ["To understand why this communicative approach is superior to traditional instruction, it is first necessary to examine its psychological impact on learners.", "However, fostering a positive mindset is only the first step; how teachers structure the actual learning process is equally critical.", "Beyond enhancing learner motivation,", "Despite these clear pedagogical advantages, the shift away from rigid, teacher-centered instruction is not without controversy.", "making a balanced adoption of communicative methods all the more imperative.", "weighing both the psychological benefits and pedagogical effectiveness demonstrates that"]}, {"id": "e2", "shortTitle": "Essay 2 · 高校生成式 AI", "title": "Practice Paper 1: Generative AI in University Education", "estGrade": "B", "wordCount": "原稿約 490 詞 → 修改版約 610 詞", "summary": "相比 Essay 1 有顯著進步：成功運用段落過渡句並去掉正文期刊全名，字數提升至約 490 詞。本次主要扣分點為雙作者漏寫第二姓氏、漏標 Miller (2024)、出現第二人稱 you、As/Because 殘缺句，以及將 over-dependence 誤寫成意思相反的 independence。", "rubric": [{"name": "Task Fulfillment (25%)", "status": "進步明顯", "note": "字數增至約 490 詞，論點清楚；引言邏輯主語（大學生 vs 大學）與結尾收束可更精準。"}, {"name": "Discourse Competencies (25%)", "status": "大幅提升", "note": "漂亮運用 Beyond increasing... 與 ...is not without demerit 等過渡句，段落流暢度高出一檔。"}, {"name": "Source Integration (15%)", "status": "三大硬傷待修", "note": "① Patel (2024) 漏寫第二作者 Wong；② 反駁段引用 Miller (2024) 卻漏標出處；③ 兩處原文短語直接照搬。"}, {"name": "Language Competencies (35%)", "status": "新舊問題交錯", "note": "出現禁用的第二人稱 you；兩句 As/Because 殘缺句；independence 詞義寫反；多個高頻學術詞拼錯。"}], "paragraphs": [{"label": "引言段 (Introduction)", "issues": [{"bad": "artificial intelligence (AI) have been", "fix": "artificial intelligence (AI) has been", "cat": "主謂一致", "why": "AI / artificial intelligence 為不可數名詞，動詞必須用單數 has been。"}, {"bad": "whether undergraduate should regulate AI tools", "fix": "whether universities should regulate AI tools", "cat": "邏輯主語錯誤", "why": "制定政策監管 AI 的主體是大學（universities），而不是大學生。"}, {"bad": "may lead to independence", "fix": "may lead to student over-dependence", "cat": "詞義寫反紅燈", "why": "independence 是「獨立」，與你想表達的「過度依賴（over-dependence / reliance）」意思完全相反！"}, {"bad": "cause to serveral merit", "fix": "yields significant benefits", "cat": "搭配與拼寫", "why": "cause 多接負面結果且不加 to；several 拼錯；推薦改用 yield benefits。"}], "revised": "Nowadays, artificial intelligence (AI) has been upgraded on a large scale and has become increasingly useful. Thus, cooperating with AI in the workplace is inevitable. Therefore, there is ongoing debate regarding whether universities should regulate AI tools. While critics warn that integrating generative AI into undergraduate coursework may lead to student over-dependence, this essay argues that the guided use of AI yields significant benefits, including deeper learning and intellectual growth."}, {"label": "主體段一：提升就業力與引導式使用 (Body 1)", "issues": [{"bad": "will be widen", "fix": "will be widened / will widen", "cat": "語態與動詞形態", "why": "被動語態需用過去分詞 widened，或直接用主動 will widen。"}, {"bad": "gap between academic training and industry expectations", "fix": "a widening disconnect emerges between university education and industry demands", "cat": "Patchwriting 防抄襲", "why": "原封不動抄自 Chan (2023) 原文，必須替換名詞與句構改寫。"}, {"bad": "AI acts as catalyst", "fix": "AI serves as a catalyst", "cat": "冠詞缺失", "why": "catalyst 為可數名詞單數，前面必須加上不定冠詞 a。"}], "revised": "First, the proper use of AI allows students to transition into the workplace smoothly, thereby enhancing their employability and competitiveness. According to Chan (2023), a widening disconnect emerges between university education and industry demands when institutions fail to incorporate emerging technologies. Since employers increasingly expect graduates to adapt to AI-driven workflows, providing undergraduates with structured access to these tools strengthens their career readiness. However, unrestricted reliance on AI without supervision may hinder deep learning (Chan, 2023). Consequently, educators should establish clear usage guidelines and introduce compulsory modules focusing on higher-order analysis, problem-solving, and ethical judgment (Chan, 2023). In this way, AI serves as a catalyst that empowers students rather than undermining their core competencies."}, {"label": "主體段二：學習動機與自我效能感 (Body 2)", "issues": [{"bad": "Patel (2024)", "fix": "Patel and Wong (2024) / (Patel & Wong, 2024)", "cat": "APA 雙作者規範", "why": "APA 規定雙作者文獻每次引用都必須寫全兩位姓氏，絕不可省略第二作者。"}, {"bad": "non-threatening, personalized environment", "fix": "low-stress, individualized learning space", "cat": "Patchwriting 防抄襲", "why": "直接照抄 Source C 原文詞組，改為同義表達可避免扣分。"}, {"bad": "AI-chatbox / brainstorm idea", "fix": "AI chatbots / brainstorm ideas", "cat": "拼寫與複數", "why": "聊天機器人是 chatbots（非 chatbox）；idea 為可數名詞需複數 ideas。"}, {"bad": "AI guides you study in detailed and carefully. It also gives you emotional support when you fail...", "fix": "刪除 you，改用 learners / students / them；in detailed 改為 in detail", "cat": "禁用第二人稱", "why": "英文學術議論文嚴禁使用 you / your，必須全程保持客觀第三人稱。"}], "revised": "Beyond increasing competitiveness, AI tools also enhance student motivation and self-efficacy. Due to peer pressure or limited instructor availability during office hours, undergraduates often hesitate to clarify their doubts (Patel & Wong, 2024). AI-powered platforms address this issue by offering a low-stress, individualized learning space. Specifically, AI chatbots function as 24/7 virtual tutors that help learners brainstorm ideas, receive immediate feedback, and grasp complex concepts through accessible explanations. According to Patel and Wong (2024), utilizing AI as a scaffolding tool reduces writing anxiety by accelerating the initial brainstorming process. Simultaneously, learners build greater confidence when tackling challenging assignments, as AI provides step-by-step guidance and constructive encouragement throughout their revision process."}, {"label": "主體段三：反駁段 (Counter-argument & Rebuttal)", "issues": [{"bad": "not without demerit", "fix": "not without drawbacks / risks", "cat": "學術用詞", "why": "學術寫作較少用 demerit，改用 drawbacks 或 risks 更地道。"}, {"bad": "Oponent point out... As AI-generated text is increasingly difficult to distinguish...（未標出處）", "fix": "Opponents contend that..., as AI-generated content... (Miller, 2024).", "cat": "殘缺句＋漏標出處", "why": "① Opponents 拼錯；② As 開頭無主句造成殘缺句；③ 論點來自 Source B，漏加 (Miller, 2024) 會被判抄襲！"}, {"bad": "Because most of students aim to get a better job under the help of University.", "fix": "Since most undergraduates pursue higher education to secure competitive careers, universities must evolve...", "cat": "殘缺句", "why": "Because 子句不可獨立成句，必須合併主句並提升為學術表達。"}], "revised": "However, integrating AI into undergraduate coursework is not without drawbacks. Opponents contend that unguided AI usage fosters academic dishonesty and plagiarism, as AI-generated content is increasingly difficult to distinguish from human writing using conventional detection software (Miller, 2024). While it is true that unrestricted reliance on automation can impair students' independent analytical development (Miller, 2024), completely banning AI tools would widen the skills gap between graduates and modern employers (Chan, 2023). Since most undergraduates pursue higher education to secure competitive careers, universities must evolve alongside technological advancements by regulating AI usage rather than prohibiting it entirely."}, {"label": "結論段 (Conclusion)", "issues": [{"bad": "It is nesscesary for University should integrate", "fix": "it is necessary for universities to integrate", "cat": "句型重複＋拼寫", "why": "It is necessary for sb. to do sth. 結構中不可再塞入 should；necessary 拼錯。"}, {"bad": "pros and cons / AI using course and clear AI using restriction", "fix": "benefits and risks / mandatory AI literacy courses alongside clear ethical guidelines", "cat": "學術語氣升級", "why": "pros and cons 偏口語，改用 benefits and risks 與 AI literacy courses 學術感立刻提升。"}], "revised": "In conclusion, it is necessary for universities to integrate generative AI tools into undergraduate coursework after carefully weighing their benefits and risks. To minimize potential drawbacks, institutions should implement mandatory AI literacy courses alongside clear ethical guidelines. By doing so, universities can safeguard academic integrity while equipping students with the critical thinking and technological skills required for future success."}], "transitions": ["First, the proper use of AI allows students to transition into the workplace smoothly,", "Beyond increasing competitiveness, AI tools also enhance student motivation and self-efficacy.", "However, integrating AI into undergraduate coursework is not without drawbacks.", "In conclusion, it is necessary for universities to integrate generative AI tools"]}, {"id": "e3", "shortTitle": "Essay 3 · 強制社區服務", "title": "Practice Paper 2: Mandatory Community Service in Secondary Schools", "estGrade": "B（衝 B+ 標竿版）", "wordCount": "原稿約 550–560 詞 → B+ 標竿版約 590 詞", "summary": "字數幾乎穩穩達標（550–560 詞），成功落實「目標切入法開頭」、「雙作者 APA 引用（Okafor & Silva, 2021）」和「禁用 you」。附帶公開試實戰估分：IELTS Writing Task 2 約 Band 6.0、HKDSE English Paper 2 約 Level 4（~14/21），結構已達 IELTS 6.5 / DSE Level 5 底子，只要清零語法拼寫與 Patchwriting 即可穩衝 B+！", "benchmark": {"ielts": "Band 6.0（TR 6.0–6.5 · CC 6.5 · LR 6.0 · GRA 5.5–6.0）", "dse": "Level 4 · 約 14 / 21（Content 5/7 · Language 4/7 · Organization 5/7）", "insight": "你的骨架、分段邏輯與具體舉例（安老院帶長者伸展遊戲、公開試壓力）已具備 IELTS 6.5 / DSE Level 5 水準，唯一拉低總分的是 Language 準確度與拼寫。"}, "rubric": [{"name": "Task Fulfillment (25%)", "status": "差最後一哩路", "note": "引言 Thesis 寫了 improve their academic performance，但正文兩段完全沒提學業成績，前後失焦；衝 B+ 須 100% 鎖死 Thesis 與兩大維度。"}, {"name": "Discourse Competencies (25%)", "status": "已具高分底子", "note": "Body 1 與 Body 2 原本皆偏重社交互動，套用「維度切割法（品格同理心 vs 實務職場軟實力）」與 PEEL-C 後立刻拉開層次。"}, {"name": "Source Integration (15%)", "status": "注意 Patchwriting 與姓氏", "note": "成功寫全 Okafor & Silva，但將 Tanaka 兩次拼成 Tanka，且有三處幾乎原句照抄原文。"}, {"name": "Language Competencies (35%)", "status": "消滅肌肉記憶錯字", "note": "Accordings to（多 s）、overcomed、many stress、merely 造成語義反轉、Not only 不完整倒裝。"}], "paragraphs": [{"label": "引言段 (Introduction)", "issues": [{"bad": "pedagogy（指代中學教育）", "fix": "secondary education", "cat": "詞義精準度", "why": "pedagogy 指「教學法／教育學」，切合本題對象應直接用 secondary education。"}, {"bad": "Thesis: ...and even improve their academic performance", "fix": "by nurturing genuine empathy and developing practical interpersonal skills", "cat": "Thesis 跑題紅燈", "why": "正文兩段完全沒有寫學業成績！引言 Thesis 的兩個理由必須與 Body 1、Body 2 主題句 100% 對應。"}], "revised": "A fundamental goal of secondary education is not merely to cultivate academic proficiency, but also to foster social responsibility and ethical awareness. Consequently, many educational institutions have considered making community service a mandatory requirement for graduation. While critics contend that compulsory volunteering intensifies student stress and harms mental well-being, this essay argues that a well-structured mandatory service policy significantly benefits adolescents by nurturing genuine empathy and developing practical interpersonal skills."}, {"label": "主體段一：品格與同理心維度 (Body 1)", "issues": [{"bad": "interaction opportunities with diverse community members... bridge between abstract moral concepts and practical action", "fix": "interact with people outside their immediate social circles, translating theoretical moral principles into tangible civic action (Henderson, 2018)", "cat": "Patchwriting 防抄襲", "why": "幾乎原封不動抄自 Henderson (2018)，需換詞性與動詞結構重新表達。"}, {"bad": "minorities（用來指代安老院長者）", "fix": "senior citizens / vulnerable populations / marginalized groups", "cat": "詞義誤用", "why": "minorities 通常指少數族裔，指代長者或弱勢群體應改用 senior citizens 或 underprivileged / vulnerable groups。"}], "revised": "First, integrating community service into graduation requirements enables secondary students to develop mature social values. Classroom instruction alone cannot adequately cultivate active citizenship; instead, adolescents need structured opportunities to interact with people outside their immediate social circles, translating theoretical moral principles into tangible civic action (Henderson, 2018). For instance, when students visit hospitals or elderly care centers, conversing with senior citizens allows them to hear firsthand life experiences and reflect on their own sense of purpose. Unlike textbook lessons on ethics that often feel distant and abstract, direct contact with vulnerable populations helps teenagers build genuine empathy for marginalized groups (Okafor & Silva, 2021). Consequently, students look beyond their own personal concerns and grow into compassionate individuals of integrity, which ultimately strengthens the cohesion and stability of society."}, {"label": "主體段二：實務軟實力與職場準備維度 (Body 2)", "issues": [{"bad": "Not only building social value... it allows...", "fix": "Beyond cultivating social values, mandatory community service helps students...", "cat": "不完整倒裝句", "why": "考場上不熟的倒裝句容易失分，直接換成零語法風險的 Beyond + V-ing 過渡句更穩妥高級。"}, {"bad": "Accordings to / complete structured school service program show apparently higher rates of civic participation, charitable giving, and community leadership...", "fix": "According to Okafor and Silva (2021), adolescents who complete... are significantly more likely to remain civically engaged, donate to charity, and assume leadership roles...", "cat": "肌肉記憶錯字＋抄襲", "why": "① According to 絕對沒有 s！② 原文長句幾乎照抄，需改寫動詞結構。"}], "revised": "Beyond cultivating social values, mandatory community service helps students uncover personal strengths and acquire practical interpersonal skills. According to Okafor and Silva (2021), adolescents who complete structured school service programs are significantly more likely to remain civically engaged, donate to charity, and assume leadership roles in adulthood than peers without such exposure. During hands-on placements, students frequently coordinate group activities—such as guiding elderly residents through gentle stretching exercises or interactive games—which requires them to organize their instructions clearly and maintain a patient, respectful tone. Receiving warm appreciation from participants in turn strengthens their confidence in public communication. Furthermore, compulsory programs connect students from diverse backgrounds to local community organizations they might otherwise never encounter (Okafor & Silva, 2021). By working alongside experienced mentors in these settings, teenagers expand their social networks and develop practical workplace habits that directly benefit their future careers."}, {"label": "主體段三：反駁段 (Counter-argument & Rebuttal)", "issues": [{"bad": "Tanka / many stress / deploma of secondary examination", "fix": "Tanaka (2020) / immense pressure / high-stakes public examinations", "cat": "作者姓氏＋搭配", "why": "① 兩次把 Tanaka 拼錯成 Tanka；② stress 不可數不可用 many；③ 改用 high-stakes public examinations 更符合國際學術語境。"}, {"bad": "treat service hours as a box-ticking exercise. They seek out the easiest placements rather than engaging deeply with community needs", "fix": "treat volunteering as a superficial chore, opting for the least demanding tasks simply to satisfy the quota rather than addressing genuine community needs (Tanaka, 2020)", "cat": "Patchwriting 防抄襲", "why": "幾乎整句照抄 Tanaka (2020)，改寫成 superficial chore 與 satisfy the quota 意思 100% 精準且完全換新。"}, {"bad": "view community placement merely as meaningful contributions", "fix": "perceive their placements as meaningful contributions rather than mechanical obligations", "cat": "語義反轉紅燈", "why": "忘記刪掉 merely（僅僅），導致意思變成「只視為有意義的貢獻」，把整句反駁邏輯弄反！"}], "revised": "Nevertheless, establishing community service as a compulsory graduation requirement is not without drawbacks. Opponents argue that imposing additional mandates exacerbates the heavy academic workload secondary students already face, particularly those preparing for high-stakes public examinations while managing family expectations (Tanaka, 2020). Under such immense pressure, learners may treat volunteering as a superficial chore, opting for the least demanding tasks simply to satisfy the quota rather than addressing genuine community needs (Tanaka, 2020). However, this outcome reflects poor institutional planning rather than an inherent flaw in mandatory service. As Henderson (2018) highlights, when schools thoughtfully align service hours with educational objectives, provide guided reflection, and keep workloads manageable, students perceive their placements as meaningful contributions rather than mechanical obligations. Moreover, an initial school requirement effectively lowers barriers for hesitant students who lack awareness of volunteering channels, gradually encouraging willing participation (Okafor & Silva, 2021)."}, {"label": "結論段 (Conclusion)", "issues": [{"bad": "allow students to choose the activity that they want to do", "fix": "allow students the autonomy to choose causes aligned with their interests", "cat": "結論收尾升級", "why": "原句偏口語，升級為 autonomy 與 aligned with their interests 後學術氣場立刻穩上 B+。"}, {"bad": "overcomed / allow student to / plain", "fix": "overcome / allows students to / plan", "cat": "零碎語法拼寫", "why": "overcome 過去分詞為 overcome（無 -ed）；第三人稱單數 + 複數名詞；plan 勿拼成 plain。"}], "revised": "In conclusion, secondary schools should adopt community service as a mandatory graduation requirement, as its long-term benefits in fostering empathy and practical competence outweigh its potential drawbacks. To prevent the policy from becoming an academic burden, educators should design well-balanced schedules and allow students the autonomy to choose causes aligned with their interests. Through thoughtful implementation, compulsory service can successfully prepare teenagers to become both capable professionals and responsible citizens."}], "transitions": ["Beyond cultivating social values, mandatory community service helps students", "Nevertheless, establishing community service as a compulsory graduation requirement is not without drawbacks.", "However, this outcome reflects poor institutional planning rather than an inherent flaw in mandatory service.", "In conclusion, secondary schools should adopt community service"]}];
const MISTAKES = [{"id": "m1", "cat": "語法與主謂一致", "freq": "極高頻", "essay": "Essay 1", "wrong": "more and more city connected together", "right": "cities around the world are becoming increasingly interconnected", "rule": "可數名詞裸奔需變複數（cities），且主語與動作為被動關係須補 be 動詞。"}, {"id": "m2", "cat": "語法與主謂一致", "freq": "極高頻", "essay": "Essay 1 & 3", "wrong": "LBU allow / LBU provide / allow student to", "right": "LBU allows / provides / allows students to", "rule": "單數主語（LBU / policy / method）後動詞務必加 -s；可數名詞 student 無冠詞時加複數 -s。"}, {"id": "m3", "cat": "語法與主謂一致", "freq": "高頻", "essay": "Essay 2", "wrong": "artificial intelligence (AI) have been", "right": "artificial intelligence (AI) has been", "rule": "AI / artificial intelligence 為不可數名詞，必須搭配單數動詞 has been。"}, {"id": "m4", "cat": "語法與主謂一致", "freq": "中頻", "essay": "Essay 2", "wrong": "will be widen", "right": "will be widened / will widen", "rule": "被動語態 be 後面必須接過去分詞（widened），不可接動詞原形。"}, {"id": "m5", "cat": "語法與主謂一致", "freq": "高頻", "essay": "Essay 2", "wrong": "It is nesscesary for University should integrate", "right": "It is necessary for universities to integrate", "rule": "It is + adj. + for sb. + to do sth. 結構不可再重複加入情態動詞 should。"}, {"id": "m6", "cat": "語法與主謂一致", "freq": "中頻", "essay": "Essay 3", "wrong": "overcomed", "right": "overcome", "rule": "不規則動詞：overcome – overcame – overcome，過去分詞絕不加 -ed。"}, {"id": "m7", "cat": "語法與主謂一致", "freq": "高頻", "essay": "Essay 2", "wrong": "AI acts as catalyst / brainstorm idea", "right": "AI serves as a catalyst / brainstorm ideas", "rule": "可數名詞單數前須加冠詞（a catalyst），或直接改複數（ideas）。"}, {"id": "m8", "cat": "詞性與殘缺句", "freq": "極高頻", "essay": "Essay 1", "wrong": "students are lack of ...", "right": "students lack ... / there is a lack of ...", "rule": "be 動詞後不可直接接動詞原形！lack 作及物動詞直接接賓語。"}, {"id": "m9", "cat": "詞性與殘缺句", "freq": "極高頻", "essay": "Essay 1", "wrong": "students are not dare to express there idea", "right": "students do not dare to express their ideas", "rule": "dare 作實義動詞否定用 do not dare to，不可寫 are not dare；their 勿寫成 there。"}, {"id": "m10", "cat": "詞性與殘缺句", "freq": "極高頻", "essay": "Essay 2", "wrong": "As AI-generated text is increasingly difficult to distinguish...（獨立成句）", "right": "Opponents contend that..., as AI-generated content is...", "rule": "As / Because 引導的是原因從句，不可獨立成句（Sentence Fragment），須用逗號連進主句。"}, {"id": "m11", "cat": "詞性與殘缺句", "freq": "高頻", "essay": "Essay 2", "wrong": "Because most of students aim to get a better job...（獨立成句）", "right": "Since most undergraduates pursue higher education..., universities must...", "rule": "看到句號前只有 Because... 開頭，立刻與前後句合併！"}, {"id": "m12", "cat": "詞性與殘缺句", "freq": "高頻", "essay": "Essay 3", "wrong": "Not only building social value... it allows...", "right": "Beyond cultivating social values, mandatory service also allows...", "rule": "考場寧可用 100% 正確的 Beyond + V-ing，也不要冒險寫不完整的倒裝句。"}, {"id": "m13", "cat": "詞性與殘缺句", "freq": "中頻", "essay": "Essay 1 & 2", "wrong": "learn second language successful / in detailed", "right": "master a second language successfully / in detail", "rule": "修飾動詞用副詞 successfully；「詳細地」固定片語為 in detail（無 -ed）。"}, {"id": "m14", "cat": "詞性與殘缺句", "freq": "中頻", "essay": "Essay 2", "wrong": "cause to serveral merit", "right": "yields significant benefits", "rule": "cause 多用於負面後果且不加 to；表帶來正面好處用 yield / bring benefits。"}, {"id": "m15", "cat": "詞義與中式英語", "freq": "致命紅燈", "essay": "Essay 2", "wrong": "integrating AI may lead to independence", "right": "integrating AI may lead to over-dependence / reliance", "rule": "independence 是「獨立」，與你想表達的「過度依賴」意思完全相反！"}, {"id": "m16", "cat": "詞義與中式英語", "freq": "致命紅燈", "essay": "Essay 3", "wrong": "view community placement merely as meaningful contributions", "right": "perceive their placements as meaningful contributions", "rule": "改寫對調詞語時忘記刪掉 merely（僅僅），會讓整句意思反轉。"}, {"id": "m17", "cat": "詞義與中式英語", "freq": "高頻", "essay": "Essay 1", "wrong": "solid second language", "right": "rigid / inflexible grammatical rules", "rule": "solid 是褒義「扎實的」；指死板僵化的英文應用 rigid 或 textbook-bound。"},
